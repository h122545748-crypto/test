<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><文舞集>簽到</title>
  
  <!-- 引入 Three.js 用於背景 WebGL 特效 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    *{box-sizing:border-box}
    
    /* 調整 body，不再侷限置中，改為滿版且支援 WebGL 背景顯示 */
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background-color:#121212;
      color:#fff;
      margin:0;
      padding:15px;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }

    /* WebGL 背景相關樣式 */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    .clean-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 30, 30, 0.8);
      border: 1px solid #444;
      color: #aaa;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      z-index: 1000;
      transition: all 0.2s;
    }
    .clean-btn:hover {
      background: #ff007f;
      color: #fff;
      border-color: #ff007f;
    }

    /* 可拖曳與改變大小的視窗容器 (支援滑鼠操作) */
    .card-container{
      background:rgba(30,30,30,0.92);
      backdrop-filter: blur(10px);
      padding:24px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.5);
      width: 500px;
      max-width: 100%;
      text-align:center;
      position:absolute;
      top: 50px;
      left: 50px;
      resize: both;
      overflow: auto;
      min-width: 320px;
      min-height: 400px;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    /* 可拖曳標題列樣式 */
    .drag-header {
      cursor: move;
      user-select: none;
      padding-bottom: 5px;
      margin-bottom: 10px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }

    h2{font-size:28px;margin-top:0;color:#ff007f;margin-bottom:0}
    
    .course-list-box{background:#2a2a2a;border:1px solid #444;border-radius:12px;padding:12px;margin:15px 0;text-align:left}
    .course-list-title{font-size:16px;font-weight:700;color:#00d2ff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .course-item{display:flex;align-items:center;justify-content:space-between;background:#181818;padding:10px 12px;border-radius:8px;margin-bottom:8px;border:1px solid #333}
    .course-info-text{font-size:14px;line-height:1.3;flex:1;padding-right:10px}
    .course-name{font-weight:bold;color:#fff;font-size:15px}
    .course-sub{font-size:12px;color:#aaa}
    
    .status-display{margin-top:15px;padding:25px;border-radius:16px;font-size:20px;font-weight:700;line-height:1.6;text-align:left;min-height:220px;display:flex;flex-direction:column;justify-content:center;word-break:break-all}
    .theme-standby{background-color:#2a2a2a;color:#aaa;border:2px dashed #555;text-align:center}
    .theme-waiting{background-color:#1a2332;color:#00d2ff;border:3px solid #00d2ff;animation:breathing-glow 2.5s infinite ease-in-out}
    @keyframes breathing-glow{0%,100%{opacity:.5;border-color:rgba(0,210,255,.4);box-shadow:0 0 5px rgba(0,210,255,.2)}50%{opacity:1;border-color:#00d2ff;box-shadow:0 0 20px rgba(0,210,255,.8)}}
    .theme-loading{background-color:#332b00;color:#ffeb3b;position:relative;border:4px solid transparent;border-image:linear-gradient(90deg,#ffcc00,#332b00,#ffcc00,#332b00) 1;animation:marquee-border 1.2s linear infinite}
    @keyframes marquee-border{0%{border-image:linear-gradient(0deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}25%{border-image:linear-gradient(90deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}50%{border-image:linear-gradient(180deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}75%{border-image:linear-gradient(270deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}100%{border-image:linear-gradient(360deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}}
    .theme-success{background-color:#004d20;color:#00ff66;border:3px solid #00ff66}
    .theme-error{background-color:#5a0000;color:#ff4d4d;border:3px solid #ff4d4d}
    .theme-admin{background-color:#4a0072;color:#e040fb;border:3px solid #e040fb}
    .highlight-val{font-size:28px;font-weight:900;color:#fff}

    .check-icon-blink {
      color: #ff3333;
      font-weight: 900;
      margin-right: 4px;
      display: inline-block;
      animation: blink-check 0.8s infinite alternate;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    }
    @keyframes blink-check {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.2; transform: scale(1.15); }
    }

    .history-box{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.3);font-size:14px;color:#e0e0e0;font-weight:400}
    .history-title{font-size:15px;font-weight:700;color:#ffeb3b;margin-bottom:6px}
    .history-item{padding:2px 0;font-family:monospace}
    .confirm-box{display:none;background:#332b00;border:3px solid #ffcc00;padding:20px;border-radius:16px;margin-top:15px;text-align:center}
    .confirm-btn-group{display:flex;gap:12px;margin-top:15px}
    .btn-confirm-no,.btn-confirm-yes{flex:1;color:#fff;border:none;padding:18px;font-size:22px;font-weight:700;border-radius:12px;cursor:pointer}
    .btn-confirm-yes{background:#28a745}
    .btn-confirm-no{background:#dc3545}
    .admin-panel{display:none;margin-top:20px;padding:20px;background:#2c2c2c;border-radius:16px;border:2px solid #e040fb;text-align:left}
    .admin-panel h3{color:#e040fb;margin-top:0;font-size:22px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:16px;margin-bottom:5px;color:#ccc}
    .form-group input,.form-group select{width:100%;padding:12px;font-size:18px;border-radius:8px;border:none;background:#333;color:#fff}
    .btn-admin-act{background:#e040fb;color:#fff;border:none;padding:12px;font-size:18px;font-weight:700;border-radius:8px;width:100%;margin-top:10px;cursor:pointer}
    .btn-danger{background:#d32f2f!important}
    .btn-info{background:#0288d1!important}
    .btn-warning{background:#f57c00!important}
    .btn-close-admin{background:#666;margin-top:15px}
    .admin-section{margin-top:15px;padding-top:15px;border-top:1px solid #444}
    .log-list{max-height:250px;overflow-y:auto;background:#1e1e1e;border-radius:8px;padding:10px;margin-top:10px;font-size:15px}
    .log-item{padding:8px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
    .btn-refund{background:#ff9800;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
    .switch-container{display:flex;align-items:center;justify-content:space-between;background:#222;padding:10px 14px;border-radius:8px;margin-top:15px}
    .switch{position:relative;display:inline-block;width:50px;height:26px}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#555;transition:.3s;border-radius:26px}
    .slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background-color:#fff;transition:.3s;border-radius:50%}
    input:checked+.slider{background-color:#00ff66}
    input:checked+.slider:before{transform:translateX(24px)}
    
    .idle-warning-box{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);width:90%;max-width:460px;background:#ff007f;color:#fff;padding:15px;border-radius:12px;box-shadow:0 0 30px rgba(255,0,127,1);z-index:9999;text-align:center;font-weight:700;animation:pulse-warn .4s infinite alternate}
    @keyframes pulse-warn{0%{transform:translateX(-50%) scale(1);background:#ff007f;box-shadow:0 0 20px rgba(255,0,127,.8)}100%{transform:translateX(-50%) scale(1.05);background:#ff6600;box-shadow:0 0 40px rgba(255,102,0,1)}}

    .report-modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:10000;justify-content:center;align-items:center;padding:12px}
    .report-content-box{background:#1a1a1a;border:2px solid #00d2ff;border-radius:16px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 25px rgba(0,210,255,0.3)}
    .report-header{background:linear-gradient(135deg, #2a2a2a, #111);padding:14px 18px;border-bottom:1px solid #444;display:flex;justify-content:space-between;align-items:center}
    .report-header h4{margin:0;color:#00d2ff;font-size:18px;display:flex;align-items:center;gap:6px}
    .report-body{padding:12px;overflow-y:auto;color:#fff;line-height:1.4;text-align:left}
    .btn-close-modal{background:#ff007f;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
    .settlement-control-box{background:#222;border:1px solid #444;padding:10px;border-radius:8px;margin-bottom:10px;display:flex;gap:8px}

    .summary-card{background:linear-gradient(135deg,#3a1c5d,#1a0b33);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid #7b2cbf;display:flex;justify-content:space-around;text-align:center}
    .summary-item .num{font-size:20px;font-weight:900;color:#00ff66}
    .summary-item .label{font-size:12px;color:#bbb}
    .teacher-section{margin-bottom:16px;background:#242424;border-radius:10px;border:1px solid #333;overflow:hidden}
    .teacher-head{background:#4a0072;color:#fff;padding:8px 12px;font-weight:700;font-size:15px;display:flex;justify-content:space-between}
    .report-table{width:100%;border-collapse:collapse;font-size:13px}
    .report-table th{background:#333;color:#00d2ff;padding:8px 6px;text-align:left;font-weight:600;border-bottom:1px solid #444}
    .report-table td{padding:8px 6px;border-bottom:1px solid #2a2a2a;vertical-align:top}
    .badge-count{background:#00d2ff;color:#000;font-weight:700;padding:2px 6px;border-radius:10px;font-size:12px}
    .student-tag{display:inline-block;background:#333;color:#e0e0e0;padding:2px 6px;border-radius:4px;margin:2px;font-size:12px;border:1px solid #444}
    .btn-view-students{background:#00b0ff;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:16px;width:100%;margin-top:12px;cursor:pointer;display:none}
  </style>
</head>
<body>

<!-- WebGL 背景與清理按鈕 -->
<canvas id="canvas"></canvas>
<div class="clean-btn">clean the screen</div>

<div id="idleWarningBox" class="idle-warning-box">
  ⚠️ 檢測到閒置！系統即將於 <span id="idleCountdownSec" style="font-size:32px;text-decoration:underline;color:#fff;">5</span> 秒後自動退出管理者模式！<br>
  <span style="font-size:14px;opacity:.9">(請點擊或觸碰畫面任意處繼續使用)</span>
</div>

<div id="reportModal" class="report-modal">
  <div class="report-content-box">
    <div class="report-header">
      <h4 id="reportTitle">📊 統計報告</h4>
      <button class="btn-close-modal" onclick="closeReportModal()">關閉</button>
    </div>
    <div id="reportText" class="report-body">載入中...</div>
  </div>
</div>

<!-- 可拖曳與調整大小的簽到主卡片容器 -->
<div class="card-container" id="cardContainer">
  <div class="drag-header" id="dragHeader">
    <h2>&lt;文舞集&gt;簽到</h2>
    <div style="font-size:11px; color:#888; margin-top:2px;">(可按住此處拖曳視窗，或透過右下角調整大小)</div>
  </div>

  <div class="course-list-box">
    <div class="course-list-title">
      <span>📅 當日上架課程 (現場人員操作)</span>
      <span id="todayLabel" style="font-size:12px;color:#aaa">載入中...</span>
    </div>
    <div id="courseItemsContainer">
      <div style="color:#aaa;text-align:center;padding:10px;">正在讀取當日課程...</div>
    </div>
  </div>

  <div id="displayWindow" class="status-display theme-standby">請現場人員先開啟上方欲簽到課程之開關...</div>

  <div id="confirmBox" class="confirm-box">
    <div id="confirmMsg" style="font-size:20px;color:#ffeb3b;font-weight:700"></div>
    <div class="confirm-btn-group">
      <button id="btnConfirmYes" class="btn-confirm-yes">是 (再扣 1 點)</button>
      <button id="btnConfirmNo" class="btn-confirm-no">否 (取消)</button>
    </div>
  </div>

  <div id="adminPanel" class="admin-panel">
    <h3>👑 管理者控制台 (已暫停扣款)</h3>
    <p style="font-size:16px;color:#fff;margin-bottom:5px">當前讀取卡號：<b id="adminTargetCard" style="color:#00d2ff;font-size:20px">請輸入或刷卡...</b></p>
    <p id="cardStatusBadge" style="font-size:14px;color:#ffeb3b;font-weight:700;margin-top:0"></p>

    <button id="btnViewStudents" class="btn-view-students" onclick="fetchCourseStudents()">📋 查看此課程上課人員名單</button>

    <div class="admin-section">
      <div class="settlement-control-box">
        <select id="selectSettlementMonth" style="flex:1;padding:8px;background:#333;color:#fff;border:none;border-radius:6px;font-size:16px;">
          <option value="">自動搜尋月份中...</option>
        </select>
        <button class="btn-admin-act btn-info" style="margin-top:0;width:auto;padding:8px 15px;" onclick="triggerMonthlySettlement()">📊 月份結算</button>
      </div>

      <button class="btn-admin-act btn-info" style="margin-top:8px;" onclick="fetchRecentLogs()">📋 查詢 1 小時內簽到名單</button>
      <div id="recentLogsContainer" style="display:none;margin-top:10px">
        <div id="recentLogsList" class="log-list"></div>
      </div>
    </div>

    <div class="admin-section">
      <button class="btn-admin-act btn-warning" onclick="toggleReplaceMode()">🔄 進入卡片遺失換卡模式</button>
      <div id="replaceSection" class="replace-box" style="display:none;background:#332200;border:2px solid #ff9800;padding:15px;border-radius:12px;margin-top:10px">
        <h4 style="color:#ff9800;margin-top:0">💳 遺失換卡模式步驟：</h4>
        <p style="font-size:14px;color:#ddd;margin:5px 0">1. 請將<b>【全新新卡】</b>靠卡/刷卡輸入<br>當前感應新卡號：<b id="newCardDisplay" style="color:#00d2ff">未讀取</b></p>
        <div class="form-group" style="margin-top:10px">
          <label>2. 請輸入要換卡的會員姓名：</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="replaceSearchName" placeholder="輸入姓名...">
            <button onclick="searchReplaceUser()" style="width:100px;background:#00b0ff;border:none;color:#fff;border-radius:8px;font-weight:700">查詢</button>
          </div>
        </div>
        <div id="replaceUserPreview" style="display:none;background:#222;padding:10px;border-radius:8px;margin-top:10px;font-size:15px"></div>
        <button id="btnConfirmReplace" class="btn-admin-act btn-danger" style="display:none;margin-top:10px" onclick="executeCardReplace()">3. 確定更換（廢除舊卡）</button>
      </div>
    </div>

    <div id="sectionNewCard" class="admin-section" style="display:none">
      <h4>✨ 建立新會員資料</h4>
      <div class="form-group">
        <label>使用者姓名：</label>
        <input type="text" id="newUserName" placeholder="例如：王小明">
      </div>
      <div class="form-group">
        <label>卡片類別：</label>
        <select id="newCardType">
          <option value="一般">一般會員</option>
          <option value="VIP">VIP 會員</option>
          <option value="體驗">體驗學員</option>
          <option value="管理者">管理者</option>
        </select>
      </div>
      <div class="form-group">
        <label>初始點數 (預設 10 點)：</label>
        <input type="number" id="newCardPoints" value="10">
      </div>
      <div class="form-group">
        <label>使用期限 (預設今日 +100 天)：</label>
        <input type="date" id="newCardExpiry">
      </div>
      <button class="btn-admin-act" onclick="submitNewCard()">確認開卡 / 建立帳號</button>
    </div>

    <div id="sectionAddPoints" class="admin-section" style="display:none">
      <h4>🎟️ 點數儲值與展延</h4>
      <div class="form-group">
        <label>展延到期日 (預設：當前到期日+剩餘天數+100天)：</label>
        <input type="date" id="addPointExpiry">
      </div>
      <button class="btn-admin-act" style="background:#00c853;margin-bottom:8px" onclick="submitAddPoints(10)">+ 增加 10 點</button>
      <button class="btn-admin-act" style="background:#00b0ff;margin-bottom:12px" onclick="submitAddPoints(12)">+ 增加 12 點</button>
      <div class="switch-container">
        <span style="font-size:14px;color:#ff8a80;font-weight:700">解鎖刪除卡片功能：</span>
        <label class="switch">
          <input type="checkbox" id="toggleDeleteUnlock" onchange="handleToggleDelete(this)">
          <span class="slider"></span>
        </label>
      </div>
      <button id="btnDeleteCard" class="btn-admin-act btn-danger" style="display:none;margin-top:10px" onclick="submitDeleteCard()">🗑️ 確定刪除此卡片資料</button>
    </div>

    <button class="btn-admin-act btn-close-admin" onclick="closeAdminPanel()">退出管理者模式 (恢復打卡扣點)</button>
  </div>
</div>

<!-- GLSL Shaders 用於 WebGL Flower Cursor 背景特效 -->
<script type="x-shader/x-fragment" id="fragmentShader">
    #define PI 3.14159265359

    uniform float u_ratio;
    uniform float u_moving;
    uniform float u_stop_time;
    uniform float u_speed;
    uniform vec2 u_stop_randomizer;
    uniform float u_clean;
    uniform vec2 u_point;
    uniform sampler2D u_texture;
    varying vec2 vUv;

    float rand(vec2 n) {
        return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453);
    }
    float noise(vec2 n) {
        const vec2 d = vec2(0., 1.);
        vec2 b = floor(n), f = smoothstep(vec2(0.), vec2(1.), fract(n));
        return mix(mix(rand(b), rand(b + d.yx), f.x), mix(rand(b + d.xy), rand(b + d.yy), f.x), f.y);
    }

    float flower_shape(vec2 _point, float _size, float _outline, float _tickniess, float _noise, float _angle_offset) {
        float random_by_uv = noise(vUv);

        float petals_thickness = .5;
        float petals_number = 5. + floor(u_stop_randomizer[0] * 4.);
        float angle_animated_offset = .7 * (random_by_uv - .5) / (1. + 30. * u_stop_time);
        float flower_angle = atan(_point.y, _point.x) - angle_animated_offset;
        float flower_sectoral_shape = abs(sin(flower_angle * .5 * petals_number + _angle_offset)) + _tickniess * petals_thickness;

        vec2 flower_size_range = vec2(4., 18.);
        float flower_radial_shape = length(_point) * (flower_size_range[0] + flower_size_range[1] * u_stop_randomizer[0]);
        float radius_noise = sin(flower_angle * 13. + 15. * random_by_uv);
        flower_radial_shape += _noise * radius_noise;

        float flower_radius_grow = min(20000. * u_stop_time, 1.);
        flower_radius_grow = 1. / flower_radius_grow;

        float flower_shape = 1. - smoothstep(0., _size * flower_sectoral_shape, _outline * flower_radius_grow * flower_radial_shape);
        flower_shape *= (1. - u_moving);

        flower_shape *= (1. - step(1., u_stop_time));

        return flower_shape;
    }

    void main() {
        vec3 base = texture2D(u_texture, vUv).xyz;
        vec2 cursor = vUv - u_point.xy;
        cursor.x *= u_ratio;

        vec3 stem_color = vec3(0., 2., 1.5);
        float stem_radius = .003 * u_speed * u_moving;
        float stem_shape = 1. - pow(smoothstep(0., stem_radius, dot(cursor, cursor)), .03);
        vec3 stem = stem_shape * stem_color;

        vec3 flower_color = vec3(.7 + u_stop_randomizer[1], .8 * u_stop_randomizer[1], 2.9 + u_stop_randomizer[0] * .6);
        vec3 flower_new = flower_color * flower_shape(cursor, 1., .96, 1., .15, 0.);
        vec3 flower_mask = 1. - vec3(flower_shape(cursor, 1.05, 1.07, 1., .15, 0.));
        vec3 flower_mid = vec3(-.6) * flower_shape(cursor, .15, 1., 2., .1, 1.9);

        vec3 color = base * flower_mask + (flower_new + flower_mid + stem);
        color *= u_clean;
        color = clamp(color, vec3(.0, .0, .15), vec3(1., 1., .4));

        gl_FragColor = vec4(color, 1.);
    }
</script>

<script type="x-shader/x-vertex" id="vertexShader">
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.);
    }
</script>

<!-- 主程式與 WebGL 背景互動邏輯 -->
<script>
  const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbxh-0Xq4bF3sPYwwI-H6MjpN2ZjY3Jp1_ZfQN2TBrzNqGPj2P0MjudeHG2DYsQE4oytEg/exec";
  const displayWindow=document.getElementById("displayWindow"),adminPanel=document.getElementById("adminPanel"),adminTargetCard=document.getElementById("adminTargetCard"),cardStatusBadge=document.getElementById("cardStatusBadge"),confirmBox=document.getElementById("confirmBox"),confirmMsg=document.getElementById("confirmMsg"),sectionNewCard=document.getElementById("sectionNewCard"),sectionAddPoints=document.getElementById("sectionAddPoints"),replaceSection=document.getElementById("replaceSection"),idleWarningBox=document.getElementById("idleWarningBox"),idleCountdownSec=document.getElementById("idleCountdownSec"),btnViewStudents=document.getElementById("btnViewStudents");
  
  let isScanning=!1,isAdminMode=!1,isReplaceMode=!1,currentScannedCardForAdmin="",pendingCardId="",targetReplaceUser=null,autoResetTimer=null,adminIdleTimer=null,adminCountdownInterval=null,countdownSeconds=5,audioCtx=null;
  let activeCourseInfo="",activeCourseName="";

  let keyboardBuffer = "";
  let keyboardTimer = null;

  window.addEventListener("DOMContentLoaded", ()=>{
    fetchTodayCourses();
    initMonthDropdown();
    initKeyboardScanListener();
    initDraggableCard();
    initWebGLBackground();
  });

  // 實作卡片視窗滑鼠拖曳移動功能
  function initDraggableCard() {
    const card = document.getElementById("cardContainer");
    const header = document.getElementById("dragHeader");
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    header.addEventListener("mousedown", (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialLeft = card.offsetLeft;
      initialTop = card.offsetTop;
      card.style.position = "absolute";
      e.preventDefault();
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      card.style.left = `${initialLeft + dx}px`;
      card.style.top = `${initialTop + dy}px`;
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });
  }

  // 初始化 WebGL Flower Cursor 背景特效
  function initWebGLBackground() {
    const canvasEl = document.querySelector("#canvas");
    const cleanBtn = document.querySelector(".clean-btn");

    const pointer = {
        x: .5,
        y: .65,
        moved: false,
        speed: 0,
        vanishCanvas: false,
        drawingAllowed: true,
    };
    window.setTimeout(() => {
        pointer.x = .7;
        pointer.y = .5;
        pointer.moved = true;
    }, 400);

    let basicMaterial, shaderMaterial;

    let renderer = new THREE.WebGLRenderer({
        canvas: canvasEl,
        alpha: true,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    let sceneShader = new THREE.Scene();
    let sceneBasic = new THREE.Scene();
    let camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
    let clock = new THREE.Clock();

    let renderTargets = [
        new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight),
        new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight)
    ];

    createPlane();
    updateSize();
    window.addEventListener("resize", () => {
        cleanCanvas();
        updateSize();
    });

    render();

    window.addEventListener("mousemove", (e) => {
        if (pointer.drawingAllowed) {
            pointer.moved = true;
            const dx = 12 * (e.pageX / window.innerWidth - pointer.x);
            const dy = 12 * (e.pageY / window.innerHeight - pointer.y);
            pointer.x = e.pageX / window.innerWidth;
            pointer.y = e.pageY / window.innerHeight;
            pointer.speed = Math.min(2, Math.pow(dx, 2) + Math.pow(dy, 2));
        }
    });
    canvasEl.addEventListener("click", (e) => {
        pointer.x = e.pageX / window.innerWidth;
        pointer.y = e.pageY / window.innerHeight;
        pointer.drawingAllowed = !pointer.drawingAllowed;
        if (pointer.drawingAllowed) {
            pointer.moved = true;
        }
    });
    window.addEventListener("touchmove", (e) => {
        pointer.moved = true;
        const dx = 5 * (e.targetTouches[0].pageX / window.innerWidth - pointer.x);
        const dy = 5 * (e.targetTouches[0].pageY / window.innerHeight - pointer.y);
        pointer.x = e.targetTouches[0].pageX / window.innerWidth;
        pointer.y = e.targetTouches[0].pageY / window.innerHeight;
        pointer.speed = Math.min(2, 20 * (Math.pow(dx, 2) + Math.pow(dy, 2)));
    });

    window.addEventListener("keydown", (e) => {
        if (e.key === " ") {
            cleanCanvas();
        }
    });
    cleanBtn.addEventListener("click", cleanCanvas);

    function cleanCanvas() {
        pointer.vanishCanvas = true;
        setTimeout(() => {
            pointer.vanishCanvas = false;
        }, 50);
    }

    function createPlane() {
        shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                u_stop_time: {type: "f", value: 0.},
                u_point: {type: "v2", value: new THREE.Vector2(pointer.x, pointer.y)},
                u_moving: {type: "f", value: 0.},
                u_speed: {type: "f", value: 0.},
                u_stop_randomizer: {type: "v2", value: new THREE.Vector2(Math.random(), Math.random())},
                u_clean: {type: "f", value: 1.},
                u_ratio: {type: "f", value: window.innerWidth / window.innerHeight},
                u_texture: {type: "t", value: null}
            },
            vertexShader: document.getElementById("vertexShader").textContent,
            fragmentShader: document.getElementById("fragmentShader").textContent
        });
        basicMaterial = new THREE.MeshBasicMaterial();

        const planeGeometry = new THREE.PlaneGeometry(2, 2);
        const planeBasic = new THREE.Mesh(planeGeometry, basicMaterial);
        const planeShader = new THREE.Mesh(planeGeometry, shaderMaterial);
        sceneBasic.add(planeBasic);
        sceneShader.add(planeShader);
    }

    function render() {
        shaderMaterial.uniforms.u_clean.value = pointer.vanishCanvas ? 0 : 1;
        shaderMaterial.uniforms.u_point.value = new THREE.Vector2(pointer.x, 1 - pointer.y);
        shaderMaterial.uniforms.u_texture.value = renderTargets[0].texture;
        shaderMaterial.uniforms.u_ratio.value = window.innerWidth / window.innerHeight;
        if (pointer.moved) {
            shaderMaterial.uniforms.u_moving.value = 1.;
            shaderMaterial.uniforms.u_stop_randomizer.value = new THREE.Vector2(Math.random(), Math.random());
            if (window.innerWidth < 650) {
                shaderMaterial.uniforms.u_stop_randomizer.value.x *= .2;
                shaderMaterial.uniforms.u_stop_randomizer.value.x += .8;
            }
            shaderMaterial.uniforms.u_stop_time.value = 0.;
            pointer.moved = false;
        } else {
            shaderMaterial.uniforms.u_moving.value = 0.;
        }
        shaderMaterial.uniforms.u_stop_time.value += clock.getDelta();
        shaderMaterial.uniforms.u_speed.value = pointer.speed;

        renderer.setRenderTarget(renderTargets[1]);
        renderer.render(sceneShader, camera);

        basicMaterial.map = renderTargets[1].texture;

        renderer.setRenderTarget(null);
        renderer.render(sceneBasic, camera);

        let tmp = renderTargets[0];
        renderTargets[0] = renderTargets[1];
        renderTargets[1] = tmp;

        requestAnimationFrame(render);
    }

    function updateSize() {
        shaderMaterial.uniforms.u_ratio.value = window.innerWidth / window.innerHeight;
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
  }

  function initKeyboardScanListener() {
    window.addEventListener("keydown", (e) => {
      const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "select" || tag === "textarea") {
        return;
      }

      if (e.key === "Enter") {
        if (keyboardBuffer.trim().length > 0) {
          const scannedCode = keyboardBuffer.trim().toUpperCase();
          keyboardBuffer = "";
          handleCardInput(scannedCode);
        }
      } else if (e.key.length === 1) {
        keyboardBuffer += e.key;
        if (keyboardTimer) clearTimeout(keyboardTimer);
        keyboardTimer = setTimeout(() => {
          keyboardBuffer = "";
        }, 500);
      }
    });
  }

  async function handleCardInput(cardId) {
    if (isAdminMode) {
      resetAdminIdleTimer();
      currentScannedCardForAdmin = cardId;
      adminTargetCard.innerText = cardId;
      document.getElementById("toggleDeleteUnlock").checked = !1;
      document.getElementById("btnDeleteCard").style.display = "none";

      if (isReplaceMode) {
        document.getElementById("newCardDisplay").innerText = cardId;
        playSoundSuccess();
        return;
      }

      setDisplay("🔍 正在查詢卡片狀態...", "theme-loading");
      try {
        const t = await safeFetch({ action: "checkCard", cardId: cardId });
        if (!t) return;
        if ("exists" === t.status) {
          sectionNewCard.style.display = "none";
          sectionAddPoints.style.display = "block";
          const e = calcRechargeExpiry(t.expiryDate);
          document.getElementById("addPointExpiry").value = e;
          
          let isLockedHint = t.isLocked ? " <span style='color:#ff4d4d;'>(⚠️ 已鎖卡)</span>" : "";
          cardStatusBadge.innerHTML = `⚠️ 既有學員：${t.name}（剩餘 ${t.points} 點，原到期日 ${t.expiryDate || "無"}）${isLockedHint}`;
          
          let n = "";
          n = t.logsAfterRecharge && t.logsAfterRecharge.length > 0 
            ? t.logsAfterRecharge.map((item => `<div class="history-item">🕒 ${item.time}</div>`)).join("") 
            : `<div class="history-item" style="color:#aaa;">儲值後尚無進場打卡紀錄</div>`;
            
          setDisplay(`
            <div style="text-align: center;">
              姓名：<b>${t.name}</b><br>
              點數：<b>${t.points}</b> 點<br>
              使用期限：${t.expiryDate || "無期限"}${t.isLocked ? " (已鎖卡)" : ""}
            </div>
            <div class="history-box" style="margin-top:15px; text-align:left; max-height:160px; overflow-y:auto;">
              <div class="history-title" style="color:#00d2ff;">💰 最近一次儲值/開卡時間：</div>
              <div class="history-item" style="margin-bottom:8px; font-weight:bold;">${t.lastRechargeTime}</div>
              <div class="history-title" style="color:#ffeb3b;">📌 儲值(開卡)後打卡紀錄:</div>
              ${n}
            </div>
          `, "theme-admin");
          playSoundSuccess();
        } else {
          sectionNewCard.style.display = "block";
          sectionAddPoints.style.display = "none";
          document.getElementById("newCardPoints").value = 10;
          document.getElementById("newCardExpiry").value = calcFutureDate(100);
          cardStatusBadge.innerText = "✨ 此為全新的空白卡片，可建立新資料";
          setDisplay(`👑 <b>全新卡片</b><br>卡號：<b>${cardId}</b><br>請於下方面板填寫資料開卡。`, "theme-admin");
          playSoundSuccess();
        }
      } catch (err) {
        setDisplay("❌ 查詢卡片狀態失敗：" + err.message, "theme-error");
        playSoundError();
      }
      return;
    }

    if (!isScanning) {
      setDisplay("⚠️ 請先開啟上方欲簽到課程之開關！", "theme-error");
      playSoundError();
      return;
    }

    processDeduct(cardId, !1);
  }

  async function initMonthDropdown(){
    const select = document.getElementById("selectSettlementMonth");
    const res = await safeFetch({action: "getAvailableLogMonths"});
    
    select.innerHTML = "";
    if(res && res.status === "success" && res.months && res.months.length > 0){
      res.months.forEach(mStr => {
        const opt = document.createElement("option");
        opt.value = mStr;
        opt.innerText = `${mStr} 紀錄`;
        select.appendChild(opt);
      });
    } else {
      const now = new Date();
      const mStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}`;
      const opt = document.createElement("option");
      opt.value = mStr;
      opt.innerText = `${mStr} 紀錄`;
      select.appendChild(opt);
    }
  }

  function closeReportModal(){
    document.getElementById("reportModal").style.display = "none";
  }

  function closeAdminPanel(){
    isAdminMode = !1;
    adminIdleTimer && clearTimeout(adminIdleTimer);
    adminCountdownInterval && clearInterval(adminCountdownInterval);
    idleWarningBox.style.display = "none";
    adminPanel.style.display = "none";
    currentScannedCardForAdmin = "";
    if(isScanning){
      setDisplay(`💻 請使用電腦刷卡機輸入卡號簽到【${activeCourseInfo}】...`, "theme-waiting");
    } else {
      setDisplay("請現場人員先開啟上方欲簽到課程之開關...", "theme-standby");
    }
  }

  function initAudio(){audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)),"suspended"===audioCtx.state&&audioCtx.resume()}
  function playSoundSuccess(){if(initAudio(),audioCtx){const t=audioCtx.createOscillator(),e=audioCtx.createGain();t.type="sine",t.frequency.setValueAtTime(880,audioCtx.currentTime),e.gain.setValueAtTime(.3,audioCtx.currentTime),e.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.25),t.connect(e),e.connect(audioCtx.destination),t.start(),t.stop(audioCtx.currentTime+.25)}}
  function playSoundError(){if(initAudio(),audioCtx){const t=audioCtx.currentTime,e=audioCtx.createOscillator(),n=audioCtx.createGain();e.type="sawtooth",e.frequency.setValueAtTime(220,t),n.gain.setValueAtTime(.3,t),n.gain.exponentialRampToValueAtTime(.01,t+.15),e.connect(n),n.connect(audioCtx.destination),e.start(t),e.stop(t+.15);const o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type="sawtooth",o.frequency.setValueAtTime(180,t+.2),a.gain.setValueAtTime(.3,t+.2),a.gain.exponentialRampToValueAtTime(.01,t+.4),o.connect(a),a.connect(audioCtx.destination),o.start(t+.2),o.stop(t+.4)}}

  function resetAdminIdleTimer(){
    if(isAdminMode){
      adminIdleTimer&&clearTimeout(adminIdleTimer);
      adminCountdownInterval&&clearInterval(adminCountdownInterval);
      idleWarningBox.style.display="none";
      adminIdleTimer=setTimeout(()=>{startIdleCountdown()}, 20000);
    }
  }

  function startIdleCountdown(){
    countdownSeconds=5;
    idleCountdownSec.innerText=countdownSeconds;
    idleWarningBox.style.display="block";
    adminCountdownInterval=setInterval(()=>{
      countdownSeconds--;
      idleCountdownSec.innerText=countdownSeconds;
      if(countdownSeconds<=0){
        clearInterval(adminCountdownInterval);
        idleWarningBox.style.display="none";
        closeAdminPanel();
        alert("⏱️ 管理者模式已超過 25 秒未操作，系統已自動退出！");
      }
    },1000);
  }

  ["click","touchstart","touchmove","mousemove","keydown","scroll"].forEach(t=>{
    window.addEventListener(t,()=>{
      if(autoResetTimer){ clearTimeout(autoResetTimer); autoResetTimer=null; }
      isAdminMode&&resetAdminIdleTimer();
    },{passive:!0});
  });

  async function fetchTodayCourses(){
    const res = await safeFetch({action: "getTodayCourses"});
    const container = document.getElementById("courseItemsContainer");
    const todayLabel = document.getElementById("todayLabel");
    
    if(res && res.status === "success"){
      todayLabel.innerText = `${res.todayDay} 課程`;
      if(!res.courses || res.courses.length === 0){
        container.innerHTML = `<div style="color:#aaa;text-align:center;padding:10px;">今天（${res.todayDay}）暫無上架課程</div>`;
        return;
      }
      container.innerHTML = res.courses.map((c, idx) => `
        <div class="course-item">
          <div class="course-info-text">
            <div class="course-name">${c.courseName}</div>
            <div class="course-sub">👤 老師：${c.teacher} | ⏰ ${c.timeInfo}</div>
          </div>
          <label class="switch">
            <input type="checkbox" name="courseToggle" class="course-toggle-btn" data-info="${c.courseName}-${c.teacher}" data-name="${c.courseName}" onchange="handleCourseToggle(this)">
            <span class="slider"></span>
          </label>
        </div>
      `).join("");
    } else {
      container.innerHTML = `<div style="color:#ff4d4d;text-align:center;padding:10px;">讀取當日課程失敗</div>`;
    }
  }

  function handleCourseToggle(targetInput){
    const toggles = document.querySelectorAll(".course-toggle-btn");
    if(targetInput.checked){
      toggles.forEach(input => { if(input !== targetInput) input.checked = false; });
      activeCourseInfo = targetInput.getAttribute("data-info");
      activeCourseName = targetInput.getAttribute("data-name");
      
      btnViewStudents.innerText = `📋 查看【${activeCourseName}】上課人員名單`;
      btnViewStudents.style.display = "block";
      
      isScanning = !0;
      setDisplay(`💻 請使用電腦刷卡機輸入卡號簽到【${activeCourseInfo}】...`, "theme-waiting");
    } else {
      activeCourseInfo = "";
      activeCourseName = "";
      btnViewStudents.style.display = "none";
      isScanning = !0;
      setDisplay("已關閉簽到感應。請現場人員開啟欲簽到課程之開關。", "theme-standby");
    }
  }

  async function fetchCourseStudents(){
    if(!activeCourseName) return alert("請先開啟課程開關！");
    setDisplay("⏳ 正在讀取學員名單...","theme-loading");
    const res = await safeFetch({action: "getCourseStudents", courseName: activeCourseName});
    if(res && res.status === "success"){
      showStudentListModal(activeCourseName, res.students);
      setDisplay(`💻 請使用電腦刷卡機輸入卡號簽到【${activeCourseInfo}】...`, "theme-waiting");
    } else {
      alert(res ? res.message : "讀取學員名單失敗");
    }
  }

  function showStudentListModal(courseName, students){
    document.getElementById("reportTitle").innerHTML = `📋 【${courseName}】上課人員`;
    const reportBody = document.getElementById("reportText");
    
    if (!students || students.length === 0) {
      reportBody.innerHTML = `<div style="text-align:center;padding:30px;color:#aaa;">⚠️ 目前尚無預約或簽到學員</div>`;
      document.getElementById("reportModal").style.display = "flex";
      return;
    }

    let rowsHtml = students.map((s, idx) => {
      const checkMark = s.isCheckedIn ? `<span class="check-icon-blink">✔︎</span>` : ``;
      return `
        <tr>
          <td style="text-align:center;">${idx+1}</td>
          <td>${checkMark}<b>${s.name}</b></td>
          <td><a href="tel:${s.phone}" style="color:#00d2ff;">${s.phone || "無"}</a></td>
          <td><span class="student-tag" style="${s.isWalkIn ? 'background:#d32f2f;color:#fff;' : (s.isTrial ? 'background:#ff9800;color:#fff;' : 'background:#00c853;color:#fff;')}">${s.type}</span></td>
        </tr>
      `;
    }).join("");

    reportBody.innerHTML = `
      <div style="margin-bottom:10px;font-size:14px;color:#00d2ff;">👥 應到/已到總人數：<b>${students.length}</b> 人</div>
      <table class="report-table">
        <thead>
          <tr>
            <th style="width:12%;text-align:center;">#</th>
            <th style="width:30%;">姓名</th>
            <th style="width:38%;">電話</th>
            <th style="width:20%;">屬性</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
    document.getElementById("reportModal").style.display = "flex";
  }

  async function triggerMonthlySettlement(){
    const monthVal = document.getElementById("selectSettlementMonth").value;
    if(!monthVal) return alert("請選擇要結算的月份！");
    
    setDisplay("⏳ 正在計算月份數據...","theme-loading");
    const res = await safeFetch({action: "monthlySettlement", targetMonth: monthVal});
    
    if(res && res.status === "success"){
      showSettlementReportModal(res.sheetName, res.statsData);
      setDisplay("👑 <b>管理者控制台</b><br>月份結算已完成。","theme-admin");
    } else {
      alert(res ? res.message : "結算失敗");
      setDisplay("👑 <b>管理者控制台</b>","theme-admin");
    }
  }

  function showSettlementReportModal(sheetName, stats){
    document.getElementById("reportTitle").innerHTML = `📊 ${sheetName}`;
    const reportBody = document.getElementById("reportText");
    
    let totalClasses = 0, totalPeople = 0;
    let htmlContent = "";

    for(const teacher in stats){
      let teacherHtml = "";
      for(const course in stats[teacher]){
        for(const dStr in stats[teacher][course]){
          const students = stats[teacher][course][dStr];
          totalClasses++;
          totalPeople += students.length;
          teacherHtml += `
            <tr>
              <td><b>${course}</b></td>
              <td>${dStr}</td>
              <td><span class="badge-count">${students.length} 人</span></td>
              <td>${students.map(n => `<span class="student-tag">${n}</span>`).join("")}</td>
            </tr>
          `;
        }
      }

      htmlContent += `
        <div class="teacher-section">
          <div class="teacher-head">
            <span>👤 授課老師：${teacher}</span>
          </div>
          <table class="report-table">
            <thead>
              <tr>
                <th style="width:25%;">課程</th>
                <th style="width:18%;">日期</th>
                <th style="width:17%;">人次</th>
                <th style="width:40%;">簽到名單</th>
              </tr>
            </thead>
            <tbody>${teacherHtml}</tbody>
          </table>
        </div>
      `;
    }

    if(totalClasses === 0){
      reportBody.innerHTML = `<div style="text-align:center;padding:30px;color:#aaa;">⚠️ 該月份無任何打卡扣點紀錄</div>`;
    } else {
      reportBody.innerHTML = `
        <div class="summary-card">
          <div class="summary-item">
            <div class="num">${totalClasses}</div>
            <div class="label">總開課堂數</div>
          </div>
          <div class="summary-item">
            <div class="num">${totalPeople}</div>
            <div class="label">總上課人次</div>
          </div>
        </div>
        ${htmlContent}
      `;
    }

    document.getElementById("reportModal").style.display = "flex";
  }

  function calcFutureDate(days){
    const d = new Date();
    d.setDate(d.getDate() + days);
    return [d.getFullYear(), (""+(d.getMonth()+1)).padStart(2,"0"), (""+d.getDate()).padStart(2,"0")].join("-");
  }

  function calcRechargeExpiry(rawExpiryStr){
    const now = new Date();
    now.setHours(0,0,0,0);
    let remDays = 0;
    if(rawExpiryStr){
      const exp = new Date(rawExpiryStr);
      if(!isNaN(exp.getTime())){
        remDays = Math.ceil((exp - now)/(1000*60*60*24));
      }
    }
    if(remDays < 0) remDays = 0;
    return calcFutureDate(remDays + 100);
  }

  function setDisplay(t,e){displayWindow.className=`status-display ${e}`,displayWindow.innerHTML=t}
  
  function resetAutoResetTimer(timeoutMs = 3000){
    autoResetTimer&&clearTimeout(autoResetTimer);
    if(!isAdminMode){
      autoResetTimer=setTimeout(()=>{
        confirmBox.style.display="none";
        pendingCardId="";
        if(isScanning){
          setDisplay(`💻 請使用電腦刷卡機輸入卡號簽到【${activeCourseInfo}】...`,"theme-waiting");
        } else {
          setDisplay("請現場人員先開啟上方欲簽到課程之開關...","theme-standby");
        }
      }, timeoutMs);
    }
  }

  async function safeFetch(t){
    try{
      const e=await fetch(GAS_WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(t)});
      if(!e.ok)return setDisplay(`⚠️ <b>伺服器回應異常 (${e.status})</b>`,"theme-error"),playSoundError(),null;
      const n=e.headers.get("content-type");
      return n&&n.includes("application/json")?await e.json():(setDisplay("⚠️ <b>Google 伺服器連線繁忙</b><br>請稍後 3 秒重新刷卡感應。","theme-error"),playSoundError(),null)
    }catch(t){return setDisplay("❌ <b>連線失敗：</b><br>請檢查網路連線後重試。","theme-error"),playSoundError(),null}
  }

  async function processDeduct(t,e=!1){
    confirmBox.style.display="none",setDisplay(`💳 讀取卡號：<b>${t}</b><br>⏳ <b>資料處理中，請勿重複刷卡...</b>`,"theme-loading");
    const n=await safeFetch({action:"deduct",cardId:t,courseInfo:activeCourseInfo,isForce:e});
    if(n)if("success"===n.status){
      playSoundSuccess();
      
      let logsHtml = "";
      if(n.logsAfterRecharge && n.logsAfterRecharge.length > 0){
        logsHtml = n.logsAfterRecharge.map(item => `<div class="history-item">${item.time}</div>`).join("");
      } else {
        logsHtml = `<div class="history-item" style="color:#aaa;">無紀錄</div>`;
      }

      setDisplay(`
        <div style="font-size:26px; color:#00ff66; text-align:center; margin-bottom:8px; font-weight:900;">打卡成功!</div>
        <div style="font-size:20px; text-align:center; color:#00d2ff; margin-bottom:4px;">${n.courseNameOnly || activeCourseName}</div>
        <div style="font-size:28px; text-align:center; margin-bottom:12px; color:#fff; font-weight:bold;">${n.name}</div>
        <div style="font-size:16px; color:#fff; margin-bottom:4px;">點數 <span class="highlight-val">${n.remainingPoints}</span> 點</div>
        <div style="font-size:16px; color:#fff; margin-bottom:8px;">使用期限<br><span style="font-size:20px; font-weight:bold; color:#00ff66;">${n.expiryDate}</span></div>
        <div class="history-box">
          <div class="history-title">儲值(開卡)後打卡紀錄:</div>
          ${logsHtml}
        </div>
      `, "theme-success");

      resetAutoResetTimer(3000);

    }else"need_confirm"===n.status?(playSoundError(),pendingCardId=t,confirmMsg.innerHTML=n.message,confirmBox.style.display="block",setDisplay("⚠️ <b>請於下方選擇是否繼續扣點</b>","theme-admin")):"admin"===n.status?(playSoundSuccess(),isAdminMode=!0,resetAdminIdleTimer(),autoResetTimer&&clearTimeout(autoResetTimer),currentScannedCardForAdmin="",adminTargetCard.innerText="請刷卡...",cardStatusBadge.innerText="",sectionNewCard.style.display="none",sectionAddPoints.style.display="none",setDisplay("👑 <b>管理者解鎖！</b><br>已進入管理者模式，<b>簽到扣款已暫停</b>。<br>請刷卡輸入欲處理的會員卡號。","theme-admin"),adminPanel.style.display="block",initMonthDropdown()):(playSoundError(),setDisplay(`❌ <b>打卡失敗：</b><br>${n.message}<br><br>💳 卡號：${t}`,"theme-error"));
  }

  document.getElementById("btnConfirmYes").addEventListener("click",(()=>{pendingCardId&&(processDeduct(pendingCardId,!0),pendingCardId="")})),document.getElementById("btnConfirmNo").addEventListener("click",(()=>{pendingCardId="",confirmBox.style.display="none",setDisplay("已取消重複扣點。請重新刷卡打卡。","theme-standby")}));

  function toggleReplaceMode(){(isReplaceMode=!isReplaceMode)?(replaceSection.style.display="block",sectionNewCard.style.display="none",sectionAddPoints.style.display="none",setDisplay("🔄 <b>已切換至卡片遺失換卡模式</b><br>請先刷卡讀取「全新卡片」，再輸入舊學員姓名搜尋。","theme-admin")):(replaceSection.style.display="none",targetReplaceUser=null,setDisplay("已離開換卡模式。","theme-admin"))}

  async function searchReplaceUser(){
    const t=document.getElementById("replaceSearchName").value.trim();if(!t)return alert("請輸入會員姓名！");
    const e=await safeFetch({action:"searchUserByName",name:t}),n=document.getElementById("replaceUserPreview"),o=document.getElementById("btnConfirmReplace");
    e&&"found"===e.status?(playSoundSuccess(),targetReplaceUser=e.cardData,n.style.display="block",n.innerHTML=`
        <b style="color:#00ff66;">✅ 找到學員資料：</b><br>
        • 姓名：<b>${targetReplaceUser.name}</b><br>
        • 剩餘點數：<b>${targetReplaceUser.points}</b> 點<br>
        • 舊卡號：<span style="color:#ff4d4d; text-decoration:line-through;">${targetReplaceUser.oldCardId}</span>
      `,o.style.display="block"):(playSoundError(),targetReplaceUser=null,n.style.display="block",n.innerHTML='<b style="color:#ff4d4d;">❌ 查無此會員名字！</b>',o.style.display="none")
  }

  async function executeCardReplace(){
    const t=document.getElementById("newCardDisplay").innerText;if("未讀取"===t||!t)return alert("請先刷卡讀取全新新卡片！");if(!targetReplaceUser)return alert("請先搜尋並確認會員資料！");
    if(confirm(`⚠️ 確認更換？\n\n確定將【${targetReplaceUser.name}】的卡號由 ${targetReplaceUser.oldCardId} 更換為 ${t} 嗎？\n舊卡號將會廢除！`)){
      setDisplay("⏳ 正在辦理換卡與廢除舊卡...","theme-loading");
      const e=await safeFetch({action:"replaceCard",oldCardId:targetReplaceUser.oldCardId,newCardId:t,name:targetReplaceUser.name});
      e&&"success"===e.status?(playSoundSuccess(),alert(e.message),toggleReplaceMode(),document.getElementById("newCardDisplay").innerText="未讀取",document.getElementById("replaceSearchName").value="",document.getElementById("replaceUserPreview").style.display="none",setDisplay(`🎉 <b>換卡成功！</b><br>會員：<b>${targetReplaceUser.name}</b><br>新卡號已被綁定，舊卡已註銷。`,"theme-admin")):(playSoundError(),alert(e?e.message:"換卡失敗"))
    }
  }

  async function submitNewCard(){
    const t=document.getElementById("newUserName").value.trim(),e=document.getElementById("newCardType").value,n=document.getElementById("newCardPoints").value,o=document.getElementById("newCardExpiry").value;
    if(!currentScannedCardForAdmin)return alert("請先刷卡讀取要開卡的卡片！");
    if(!t)return alert("請輸入使用者姓名！");
    setDisplay("⏳ 正在建立新卡片資料...","theme-loading");
    const a=await safeFetch({action:"addCard",cardId:currentScannedCardForAdmin,name:t,cardType:e,points:n,expiryDate:o});
    a&&(alert(a.message),"success"===a.status?(playSoundSuccess(),document.getElementById("newUserName").value="",adminTargetCard.innerText="請刷卡讀取下張卡片...",cardStatusBadge.innerText="",sectionNewCard.style.display="none",setDisplay("👑 <b>卡片建立成功！</b><br>可繼續刷卡讀取下一張卡片。","theme-admin")):playSoundError())
  }

  async function submitAddPoints(t){
    if(!currentScannedCardForAdmin)return alert("請先刷卡讀取要加點的會員卡片！");
    const e=document.getElementById("addPointExpiry").value;
    if(confirm(`確定要為卡號 ${currentScannedCardForAdmin} 增加 ${t} 點，並設定到期日為 ${e} 嗎？`)){
      setDisplay("⏳ 點數儲值中...","theme-loading");
      const n=await safeFetch({action:"addPoints",cardId:currentScannedCardForAdmin,addPointsAmount:t,expiryDate:e});
      n&&(alert(n.message),"success"===n.status?(playSoundSuccess(),adminTargetCard.innerText="請刷卡讀取下張卡片...",cardStatusBadge.innerText="",sectionAddPoints.style.display="none",setDisplay("👑 <b>加點成功！</b><br>可繼續刷卡讀取下一張卡片。","theme-admin")):playSoundError())
    }
  }

  function handleToggleDelete(t){document.getElementById("btnDeleteCard").style.display=t.checked?"block":"none"}

  async function submitDeleteCard(){
    if(!currentScannedCardForAdmin)return alert("請先刷卡讀取要刪除的卡片！");
    if(confirm(`⚠️ 確定要刪除卡號 ${currentScannedCardForAdmin} 的所有資料嗎？此操作無法復原！`)){
      setDisplay("⏳ 正在刪除卡片...","theme-loading");
      const t=await safeFetch({action:"deleteCard",cardId:currentScannedCardForAdmin});
      t&&(alert(t.message),"success"===t.status?(playSoundSuccess(),document.getElementById("toggleDeleteUnlock").checked=!1,document.getElementById("btnDeleteCard").style.display="none",adminTargetCard.innerText="請刷卡讀取下張卡片...",cardStatusBadge.innerText="",sectionAddPoints.style.display="none",setDisplay("👑 <b>卡片已成功刪除！</b><br>可繼續刷卡讀取其他卡片。","theme-admin")):playSoundError())
    }
  }

  async function fetchRecentLogs(){
    const t=document.getElementById("recentLogsContainer"),e=document.getElementById("recentLogsList");
    e.innerHTML="載入中...",t.style.display="block";
    const n=await safeFetch({action:"getRecentLogs"});
    n&&"success"===n.status?(playSoundSuccess(),0===n.logs.length?e.innerHTML="<div style='color:#aaa; text-align:center;'>過去 1 小時內無學員簽到紀錄</div>":e.innerHTML=n.logs.map((t=>{
      const e=t.note.includes("已取消");
      return`
        <div class="log-item">
          <div>
            <span>⏰ ${t.time} - <b>${t.name}</b></span>
            <div style="font-size:12px; color:${e?"#ff4d4d":"#888"};">${t.note||"已簽到"}</div>
          </div>
          <div>
            ${e?'<span style="color:#aaa; font-size:12px;">(已退點)</span>':`<button class="btn-refund" onclick="cancelCheckIn('${t.cardId}', '${t.name}', '${t.fullTime}')">↩️ 取消簽到退點</button>`}
          </div>
        </div>
      `
    })).join("")):playSoundError()
  }

  async function cancelCheckIn(t,e,lTime){
    if(confirm(`確定要為【${e}】取消於 ${lTime} 的簽到並退回 1 點嗎？`)){
      setDisplay("⏳ 取消簽到中...","theme-loading");
      const n=await safeFetch({action:"cancelCheckIn",cardId:t,name:e,logTimeStr:lTime,courseInfo:activeCourseInfo});
      n&&"success"===n.status?(playSoundSuccess(),alert(n.message),fetchRecentLogs(),setDisplay("👑 <b>已成功取消簽到退點！</b>","theme-admin")):(playSoundError(),alert(n?n.message:"取消簽到失敗"))
    }
  }
</script>
</body>
</html>
