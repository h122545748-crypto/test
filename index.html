<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>&lt;文舞集&gt;簽到</title>
  <style>
    /* ==========================================
       1. 基礎核心與深色現代主題 Design Tokens
       ========================================== */
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(22, 30, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-cyan: #00f2fe;
      --primary-blue: #4facfe;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --accent-orange: #ff9100;
      --accent-purple: #7c4dff;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; overflow-x: hidden; }

    .app-container { max-width: 540px; width: 100%; margin: 0 auto; }

    /* ==========================================
       2. 頂部 Header & 當日課程區
       ========================================== */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand-title { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
    
    .course-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .course-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
    .course-title { font-size: 0.9rem; font-weight: 700; color: var(--primary-cyan); letter-spacing: 0.5px; }
    .course-date-badge { font-size: 0.75rem; color: var(--text-sub); }

    .course-list { display: flex; flex-direction: column; gap: 8px; }
    .course-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
    .course-item:hover { border-color: rgba(0, 242, 254, 0.3); }
    .course-info-text { flex: 1; padding-right: 10px; }
    .course-name { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
    .course-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }

    /* Modern Switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2a3547; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #fff; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* ==========================================
       3. 主感應與狀態顯示視窗 (#displayWindow)
       ========================================== */
    .status-display { min-height: 220px; background: var(--card-bg); border: 2px solid var(--card-border); border-radius: var(--radius-lg); padding: 24px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: all 0.3s ease; word-break: break-all; }
    
    .theme-standby { border-color: var(--card-border); color: var(--text-sub); }
    .theme-waiting { border-color: var(--primary-cyan); box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); animation: breathing-glow 2.5s infinite ease-in-out; }
    @keyframes breathing-glow { 0%,100%{ box-shadow: 0 0 10px rgba(0,242,254,0.2); } 50%{ box-shadow: 0 0 25px rgba(0,242,254,0.6); } }
    
    .theme-loading { border-color: var(--accent-orange); box-shadow: 0 0 25px rgba(255, 145, 0, 0.3); }
    .theme-success { border-color: var(--accent-green); box-shadow: 0 0 30px rgba(0, 230, 118, 0.4); }
    .theme-error { border-color: var(--accent-red); box-shadow: 0 0 30px rgba(255, 82, 82, 0.4); }
    .theme-admin { border-color: var(--accent-purple); box-shadow: 0 0 30px rgba(124, 77, 255, 0.4); }

    .highlight-val { font-size: 28px; font-weight: 900; color: var(--accent-green); }
    .check-icon-blink { color: var(--accent-red); font-weight: 900; margin-right: 4px; display: inline-block; animation: blink-check 0.8s infinite alternate; }
    @keyframes blink-check { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.2; transform: scale(1.15); } }

    .history-box { margin-top: 14px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.15); font-size: 13px; color: var(--text-sub); text-align: left; width: 100%; }
    .history-title { font-size: 14px; font-weight: 700; color: var(--primary-cyan); margin-bottom: 6px; }
    .history-item { padding: 3px 0; font-family: monospace; }

    /* 重複簽到確認框 (#confirmBox) */
    .confirm-box { display: none; background: rgba(255, 145, 0, 0.1); border: 2px solid var(--accent-orange); padding: 20px; border-radius: var(--radius-lg); margin-top: 16px; text-align: center; backdrop-filter: blur(10px); }
    .confirm-btn-group { display: flex; gap: 12px; margin-top: 14px; }
    .btn-confirm-no, .btn-confirm-yes { flex: 1; color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: var(--radius-md); cursor: pointer; transition: transform 0.1s; }
    .btn-confirm-yes { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
    .btn-confirm-no { background: var(--accent-red); }
    .btn-confirm-no:active, .btn-confirm-yes:active { transform: scale(0.97); }

    /* ==========================================
       4. 管理者控制台 (#adminPanel)
       ========================================== */
    .admin-panel { display: none; margin-top: 16px; padding: 20px; background: var(--card-bg); border-radius: var(--radius-lg); border: 1.5px solid var(--accent-purple); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(124, 77, 255, 0.2); text-align: left; }
    .admin-panel h3 { color: var(--accent-purple); margin-top: 0; font-size: 1.2rem; font-weight: 800; margin-bottom: 12px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
    .admin-section { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--card-border); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-sub); }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; font-size: 0.95rem; border-radius: var(--radius-md); border: 1px solid var(--card-border); background: rgba(0, 0, 0, 0.4); color: var(--text-main); outline: none; transition: border 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent-purple); }

    /* 按鈕樣式 */
    .btn-admin-act { background: linear-gradient(135deg, var(--accent-purple), #b388ff); color: #fff; border: none; padding: 12px; font-size: 0.95rem; font-weight: 700; border-radius: var(--radius-md); width: 100%; margin-top: 8px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
    .btn-admin-act:active { transform: scale(0.98); }
    .btn-danger { background: var(--accent-red) !important; color: #fff !important; }
    .btn-info { background: linear-gradient(135deg, var(--primary-blue), var(--primary-cyan)) !important; color: #000 !important; }
    .btn-warning { background: linear-gradient(135deg, var(--accent-orange), #ffab40) !important; color: #000 !important; }
    .btn-close-admin { background: rgba(255, 255, 255, 0.1); margin-top: 16px; }
    .btn-view-students { background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue)); color: #000; border: none; padding: 12px; border-radius: var(--radius-md); font-weight: 800; font-size: 0.95rem; width: 100%; margin-top: 12px; cursor: pointer; display: none; }

    .settlement-control-box { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--card-border); padding: 10px; border-radius: var(--radius-md); margin-bottom: 10px; display: flex; gap: 8px; }
    .log-list { max-height: 220px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: var(--radius-md); border: 1px solid var(--card-border); padding: 8px 12px; margin-top: 10px; font-size: 0.85rem; }
    .log-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .btn-refund { background: var(--accent-orange); color: #000; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .switch-container { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: var(--radius-md); margin-top: 12px; }

    /* 閒置警告 */
    .idle-warning-box { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 460px; background: rgba(255, 82, 82, 0.95); backdrop-filter: blur(10px); color: #fff; padding: 16px; border-radius: var(--radius-lg); box-shadow: 0 0 30px rgba(255,82,82,0.8); z-index: 9999; text-align: center; font-weight: 700; animation: pulse-warn .4s infinite alternate; }
    @keyframes pulse-warn { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.03); } }

    /* Modal 全螢幕彈窗 */
    .report-modal { display: none; position: fixed; inset: 0; background: rgba(10, 14, 23, 0.88); backdrop-filter: blur(12px); z-index: 10000; justify-content: center; align-items: center; padding: 16px; }
    .report-content-box { background: rgba(22, 30, 46, 0.95); border: 1px solid var(--primary-cyan); border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 35px rgba(0, 242, 254, 0.25); }
    .report-header { background: rgba(0,0,0,0.4); padding: 14px 18px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .report-header h4 { margin: 0; color: var(--primary-cyan); font-size: 1.1rem; }
    .report-body { padding: 14px; overflow-y: auto; color: var(--text-main); font-size: 0.9rem; line-height: 1.5; text-align: left; }
    .btn-close-modal { background: var(--accent-red); color: #fff; border: none; padding: 6px 14px; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; font-size: 0.85rem; }

    /* Table & Report 樣式 */
    .summary-card { background: linear-gradient(135deg, rgba(124, 77, 255, 0.2), rgba(0, 242, 254, 0.1)); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; border: 1px solid var(--accent-purple); display: flex; justify-content: space-around; text-align: center; }
    .summary-item .num { font-size: 22px; font-weight: 900; color: var(--accent-green); }
    .summary-item .label { font-size: 12px; color: var(--text-sub); }
    .teacher-section { margin-bottom: 14px; background: rgba(0, 0, 0, 0.25); border-radius: var(--radius-md); border: 1px solid var(--card-border); overflow: hidden; }
    .teacher-head { background: rgba(124, 77, 255, 0.3); color: #fff; padding: 8px 12px; font-weight: 700; font-size: 0.9rem; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .report-table th { background: rgba(255,255,255,0.05); color: var(--primary-cyan); padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--card-border); }
    .report-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: top; }
    .badge-count { background: var(--primary-cyan); color: #000; font-weight: 800; padding: 2px 6px; border-radius: 10px; font-size: 11px; }
    .student-tag { display: inline-block; background: rgba(255,255,255,0.08); color: var(--text-main); padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 11px; border: 1px solid var(--card-border); }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 頂部 Bar -->
  <header>
    <div class="brand-title">&lt;文舞集&gt;簽到</div>
  </header>

  <!-- 閒置提示 Alert -->
  <div id="idleWarningBox" class="idle-warning-box">
    ⚠️ 檢測到閒置！系統即將於 <span id="idleCountdownSec" style="font-size:30px;text-decoration:underline;color:#fff;">5</span> 秒後自動退出管理者模式！<br>
    <span style="font-size:13px;opacity:.9">(請點擊或觸碰畫面任意處繼續使用)</span>
  </div>

  <!-- 統計 Modal 彈窗 -->
  <div id="reportModal" class="report-modal">
    <div class="report-content-box">
      <div class="report-header">
        <h4 id="reportTitle">📊 統計報告</h4>
        <button class="btn-close-modal" onclick="closeReportModal()">關閉</button>
      </div>
      <div id="reportText" class="report-body">載入中...</div>
    </div>
  </div>

  <!-- 當日課程卡片 -->
  <section class="course-section">
    <div class="course-header">
      <span class="course-title">📅 當日上架課程 (現場人員操作)</span>
      <span id="todayLabel" class="course-date-badge">載入中...</span>
    </div>
    <div id="courseItemsContainer" class="course-list">
      <div style="color:var(--text-sub);text-align:center;padding:10px;font-size:0.85rem;">正在讀取當日課程...</div>
    </div>
  </section>

  <!-- 感應狀態顯示窗 -->
  <main id="displayWindow" class="status-display theme-standby">
    請現場人員先開啟上方欲簽到課程之開關...
  </main>

  <!-- 二次扣點確認彈窗 -->
  <div id="confirmBox" class="confirm-box">
    <div id="confirmMsg" style="font-size:18px;color:#ffeb3b;font-weight:700"></div>
    <div class="confirm-btn-group">
      <button id="btnConfirmYes" class="btn-confirm-yes">是 (再扣 1 點)</button>
      <button id="btnConfirmNo" class="btn-confirm-no">否 (取消)</button>
    </div>
  </div>

  <!-- 管理者控制台 -->
  <section id="adminPanel" class="admin-panel">
    <h3>👑 管理者控制台 (已暫停扣款)</h3>
    <p style="font-size:15px;color:var(--text-main);margin-bottom:4px">當前感應卡號：<b id="adminTargetCard" style="color:var(--primary-cyan);font-size:18px">請靠卡...</b></p>
    <p id="cardStatusBadge" style="font-size:13px;color:#ffeb3b;font-weight:700;margin-top:0"></p>

    <button id="btnViewStudents" class="btn-view-students" onclick="fetchCourseStudents()">📋 查看此課程上課人員名單</button>

    <div class="admin-section">
      <div class="settlement-control-box">
        <select id="selectSettlementMonth" style="flex:1;">
          <option value="">自動搜尋月份中...</option>
        </select>
        <button class="btn-admin-act btn-info" style="margin-top:0;width:auto;padding:8px 14px;" onclick="triggerMonthlySettlement()">📊 月份結算</button>
      </div>

      <button class="btn-admin-act btn-info" style="margin-top:8px;" onclick="fetchRecentLogs()">📋 查詢 1 小時內簽到名單</button>
      <div id="recentLogsContainer" style="display:none;margin-top:10px">
        <div id="recentLogsList" class="log-list"></div>
      </div>
    </div>

    <div class="admin-section">
      <button class="btn-admin-act btn-warning" onclick="toggleReplaceMode()">🔄 進入卡片遺失換卡模式</button>
      <div id="replaceSection" class="replace-box" style="display:none;background:rgba(255,145,0,0.1);border:1px solid var(--accent-orange);padding:14px;border-radius:var(--radius-md);margin-top:10px">
        <h4 style="color:var(--accent-orange);margin-top:0;font-size:0.95rem;">💳 遺失換卡模式步驟：</h4>
        <p style="font-size:13px;color:var(--text-main);margin:6px 0">1. 請將<b>【全新新卡】</b>靠卡感應<br>當前感應新卡號：<b id="newCardDisplay" style="color:var(--primary-cyan)">未讀取</b></p>
        <div class="form-group" style="margin-top:10px">
          <label>2. 請輸入要換卡的會員姓名：</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="replaceSearchName" placeholder="輸入姓名...">
            <button onclick="searchReplaceUser()" style="width:90px;background:var(--primary-cyan);border:none;color:#000;border-radius:var(--radius-md);font-weight:700;cursor:pointer;">查詢</button>
          </div>
        </div>
        <div id="replaceUserPreview" style="display:none;background:rgba(0,0,0,0.4);padding:10px;border-radius:var(--radius-sm);margin-top:10px;font-size:13px"></div>
        <button id="btnConfirmReplace" class="btn-admin-act btn-danger" style="display:none;margin-top:10px" onclick="executeCardReplace()">3. 確定更換（廢除舊卡）</button>
      </div>
    </div>

    <div id="sectionNewCard" class="admin-section" style="display:none">
      <h4 style="color:var(--primary-cyan);margin-bottom:10px;">✨ 建立新會員資料</h4>
      <div class="form-group">
        <label>使用者姓名：</label>
        <input type="text" id="newUserName" placeholder="例如：王小明">
      </div>
      <div class="form-group">
        <label>卡片類別：</label>
        <select id="newCardType">
          <option value="一般">一般會員</option>
          <option value="VIP">VIP 會員</option>
          <option value="體驗">體驗學員</option>
          <option value="管理者">管理者</option>
        </select>
      </div>
      <div class="form-group">
        <label>初始點數 (預設 10 點)：</label>
        <input type="number" id="newCardPoints" value="10">
      </div>
      <div class="form-group">
        <label>使用期限 (預設今日 +100 天)：</label>
        <input type="date" id="newCardExpiry">
      </div>
      <button class="btn-admin-act" onclick="submitNewCard()">確認開卡 / 建立帳號</button>
    </div>

    <div id="sectionAddPoints" class="admin-section" style="display:none">
      <h4 style="color:var(--accent-green);margin-bottom:10px;">🎟️ 點數儲值與展延</h4>
      <div class="form-group">
        <label>展延到期日 (預設：當前到期日+剩餘天數+100天)：</label>
        <input type="date" id="addPointExpiry">
      </div>
      <button class="btn-admin-act" style="background:linear-gradient(135deg, #00c853, #00e676);color:#000;margin-bottom:8px" onclick="submitAddPoints(10)">+ 增加 10 點</button>
      <button class="btn-admin-act" style="background:linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));color:#000;margin-bottom:12px" onclick="submitAddPoints(12)">+ 增加 12 點</button>
      <div class="switch-container">
        <span style="font-size:13px;color:var(--accent-red);font-weight:700">解鎖刪除卡片功能：</span>
        <label class="switch">
          <input type="checkbox" id="toggleDeleteUnlock" onchange="handleToggleDelete(this)">
          <span class="slider"></span>
        </label>
      </div>
      <button id="btnDeleteCard" class="btn-admin-act btn-danger" style="display:none;margin-top:10px" onclick="submitDeleteCard()">🗑️ 確定刪除此卡片資料</button>
    </div>

    <button class="btn-admin-act btn-close-admin" onclick="closeAdminPanel()">退出管理者模式 (恢復打卡扣點)</button>
  </section>
</div>

<script>
  const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbxh-0Xq4bF3sPYwwI-H6MjpN2ZjY3Jp1_ZfQN2TBrzNqGPj2P0MjudeHG2DYsQE4oytEg/exec";
  const displayWindow=document.getElementById("displayWindow"),adminPanel=document.getElementById("adminPanel"),adminTargetCard=document.getElementById("adminTargetCard"),cardStatusBadge=document.getElementById("cardStatusBadge"),confirmBox=document.getElementById("confirmBox"),confirmMsg=document.getElementById("confirmMsg"),sectionNewCard=document.getElementById("sectionNewCard"),sectionAddPoints=document.getElementById("sectionAddPoints"),replaceSection=document.getElementById("replaceSection"),idleWarningBox=document.getElementById("idleWarningBox"),idleCountdownSec=document.getElementById("idleCountdownSec"),btnViewStudents=document.getElementById("btnViewStudents");
  
  let ndefController=null,isScanning=!1,isAdminMode=!1,isReplaceMode=!1,currentScannedCardForAdmin="",pendingCardId="",targetReplaceUser=null,autoResetTimer=null,adminIdleTimer=null,adminCountdownInterval=null,countdownSeconds=5,audioCtx=null;
  let activeCourseInfo="",activeCourseName="";

  window.addEventListener("DOMContentLoaded", ()=>{
    fetchTodayCourses();
    initMonthDropdown();
  });

  async function initMonthDropdown(){
    const select = document.getElementById("selectSettlementMonth");
    const res = await safeFetch({action: "getAvailableLogMonths"});
    
    select.innerHTML = "";
    if(res && res.status === "success" && res.months && res.months.length > 0){
      res.months.forEach(mStr => {
        const opt = document.createElement("option");
        opt.value = mStr;
        opt.innerText = `${mStr} 紀錄`;
        select.appendChild(opt);
      });
    } else {
      const now = new Date();
      const mStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}`;
      const opt = document.createElement("option");
      opt.value = mStr;
      opt.innerText = `${mStr} 紀錄`;
      select.appendChild(opt);
    }
  }

  function closeReportModal(){
    document.getElementById("reportModal").style.display = "none";
  }

  function closeAdminPanel(){
    isAdminMode = !1;
    adminIdleTimer && clearTimeout(adminIdleTimer);
    adminCountdownInterval && clearInterval(adminCountdownInterval);
    idleWarningBox.style.display = "none";
    adminPanel.style.display = "none";

  function calcFutureDate(days){
    const d = new Date();
    d.setDate(d.getDate() + days);
    return [d.getFullYear(), (""+(d.getMonth()+1)).padStart(2,"0"), (""+d.getDate()).padStart(2,"0")].join("-");
  }

  function calcRechargeExpiry(rawExpiryStr){
    const now = new Date();
    now.setHours(0,0,0,0);
    let remDays = 0;
    if(rawExpiryStr){
      const exp = new Date(rawExpiryStr);
      if(!isNaN(exp.getTime())){
        remDays = Math.ceil((exp - now)/(1000*60*60*24));
      }
    }
    if(remDays < 0) remDays = 0;
    return calcFutureDate(remDays + 100);
  }

  }

  async function submitAddPoints(t){
    if(!currentScannedCardForAdmin)return alert("請先感應要加點的會員卡片！");
    const e=document.getElementById("addPointExpiry").value;
    if(confirm(`確定要為卡號 ${currentScannedCardForAdmin} 增加 ${t} 點，並設定到期日為 ${e} 嗎？`)){
      setDisplay("⏳ 點數儲值中...","theme-loading");
      const n=await safeFetch({action:"addPoints",cardId:currentScannedCardForAdmin,addPointsAmount:t,expiryDate:e});
      n&&(alert(n.message),"success"===n.status?(playSoundSuccess(),adminTargetCard.innerText="請感應下張卡片...",cardStatusBadge.innerText="",sectionAddPoints.style.display="none",setDisplay("👑 <b>加點成功！</b><br>可繼續感應下一張卡片。","theme-admin")):playSoundError())
    }
  }

  function handleToggleDelete(t){document.getElementById("btnDeleteCard").style.display=t.checked?"block":"none"}

  async function submitDeleteCard(){
    if(!currentScannedCardForAdmin)return alert("請先感應要刪除的卡片！");
    if(confirm(`⚠️ 確定要刪除卡號 ${currentScannedCardForAdmin} 的所有資料嗎？此操作無法復原！`)){
      setDisplay("⏳ 正在刪除卡片...","theme-loading");
      const t=await safeFetch({action:"deleteCard",cardId:currentScannedCardForAdmin});
      t&&(alert(t.message),"success"===t.status?(playSoundSuccess(),document.getElementById("toggleDeleteUnlock").checked=!1,document.getElementById("btnDeleteCard").style.display="none",adminTargetCard.innerText="請感應下張卡片...",cardStatusBadge.innerText="",sectionAddPoints.style.display="none",setDisplay("👑 <b>卡片已成功刪除！</b><br>可繼續感應其他卡片。","theme-admin")):playSoundError())
    }
  }

  async function fetchRecentLogs(){
    const t=document.getElementById("recentLogsContainer"),e=document.getElementById("recentLogsList");
    e.innerHTML="載入中...",t.style.display="block";
    const n=await safeFetch({action:"getRecentLogs"});
    n&&"success"===n.status?(playSoundSuccess(),0===n.logs.length?e.innerHTML="<div style='color:var(--text-sub); text-align:center;'>過去 1 小時內無學員簽到紀錄</div>":e.innerHTML=n.logs.map((t=>{
      const e=t.note.includes("已取消");
      return`
        <div class="log-item">
          <div>
            <span>⏰ ${t.time} - <b>${t.name}</b></span>
            <div style="font-size:12px; color:${e?"var(--accent-red)":"var(--text-sub)"};">${t.note||"已簽到"}</div>
          </div>
          <div>
            ${e?'<span style="color:var(--text-sub); font-size:12px;">(已退點)</span>':`<button class="btn-refund" onclick="cancelCheckIn('${t.cardId}', '${t.name}', '${t.fullTime}')">↩️ 取消簽到退點</button>`}
          </div>
        </div>
      `
    })).join("")):playSoundError()
  }

  async function cancelCheckIn(t,e,lTime){
    if(confirm(`確定要為【${e}】取消於 ${lTime} 的簽到並退回 1 點嗎？`)){
      setDisplay("⏳ 取消簽到中...","theme-loading");
      const n=await safeFetch({action:"cancelCheckIn",cardId:t,name:e,logTimeStr:lTime,courseInfo:activeCourseInfo});
      n&&"success"===n.status?(playSoundSuccess(),alert(n.message),fetchRecentLogs(),setDisplay("👑 <b>已成功取消簽到退點！</b>","theme-admin")):(playSoundError(),alert(n?n.message:"取消簽到失敗"))
    }
  }
</script>
</body>
</html>
