<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文舞集 SPECTRUM FLOW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syncopate:wght@400;700&display=swap');
:root{--lime:#d5ff00}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#010204;color:#edffe1;font-family:'DM Mono',monospace}
.stage{height:100vh;position:relative;background:radial-gradient(ellipse 55% 70% at 82% 52%,#0d1424 0%,#030407 55%,#010102 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 82% 55%,black,transparent 62%)}
.copy{position:absolute;z-index:2;left:clamp(28px,5vw,80px);top:50%;transform:translateY(-50%);max-width:400px;pointer-events:none}
h1{margin:0;font:700 clamp(36px,5vw,80px)/.85 'Syncopate',sans-serif;letter-spacing:-.09em;text-shadow:0 0 26px rgba(83,230,255,.25)}
h1 i{font-style:normal;background:linear-gradient(90deg,#00ddff,#746bff,#ff26bb,#ffde22);-webkit-background-clip:text;background-clip:text;color:transparent}
.controls-br{position:absolute;z-index:2;right:3vw;bottom:4vh;display:flex;gap:10px;flex-wrap:wrap}
button{border:1px solid rgba(112,217,255,.65);padding:11px 15px;background:rgba(58,103,156,.15);color:#def9ff;font:11px 'DM Mono',monospace;cursor:pointer;transition:.25s}
.primary{border-color:#f55ee9;background:linear-gradient(90deg,rgba(35,230,255,.16),rgba(255,40,177,.16))}
button:hover{background:linear-gradient(90deg,#00dbff,#e930d5);color:#061017;box-shadow:0 0 28px rgba(52,214,255,.42)}
.move-label{position:absolute;z-index:2;right:4vw;top:4vh;color:#b9faff;font-size:10px;letter-spacing:.15em}
.move-label:before{content:'// ';color:#ff5edc}
@media(max-width:900px){
  .copy{top:15%;transform:none;left:26px}
  h1{font-size:36px}
  .controls-br{right:auto;left:26px;bottom:3vh}
  .move-label{top:auto;bottom:10vh;right:4vw}
}
</style>
</head>
<body>
<main class="stage">
  <canvas id="world" aria-label="會隨音樂跳舞的立體螢光火柴人"></canvas>
  <section class="copy">
    <h1><i>WWJ DANCE STUDIO</i></h1>
  </section>
  <div class="controls-br">
    <button id="systemButton" class="primary">擷取電腦音訊</button>
  </div>
  <div class="move-label" id="moveLabel">ORBIT / 01</div>
</main>

<script>
// ==========================================
// 1. 全域變數與 DOM 元素初始化
// ==========================================
const C=document.querySelector('#world'),
      x=C.getContext('2d'),
      L=document.querySelector('#moveLabel'),
      B={sys:document.querySelector('#systemButton')};

let w, h, d, an, data, ac, lev=.08, lastBeat=0, m=0, from=0, blendAt=0;

// 左側火柴人位移與跑步狀態控制變數
let shiftLeft = 0;       // 累積向左偏移量 (像素)
let isRunningLeft = false; // 是否處於跑回原位狀態

// 滿位後的狀態控制變數
let leftState = 0;       // 0: 正常, 1: 暫停 1 秒, 2: 驚嘆號與全身紅光 1 秒, 3: 往回跑, 4: 使用零套舞步原地站 1 秒
let leftStateStartTime = 0;

// 舞步名稱列表（對應不同的動作庫）
const names=[
  'ORBIT','VOGUE','AIRWALK','PULSE','TIDAL','ROBOT','DRIFT','CYCLONE','KICK','SWAY',
  'RIPPLE','DIVE','GLIDE','SPRINT','FLOAT','STOMP','SHUFFLE','POP','ROCK','BOW',
  'FUNK','BURST','ECHO','NEXUS','FLUX','MATRIX','WAVE','ZENITH','QUASAR','PRISM',
  'VALENCE','HALO','GLITCH','VORTEX','STRIDE','SURGE','TWIST','SPIN','IGNITE','BLADE',
  'SHADOW','PULSAR','GRAVITY','NEON','POLAR','SYNTH','FUSION','KINETIC','LASER','ORBITAL',
  'STRATOS','QUANTUM','ZEN','STELLAR','SOLAR','LUNAR','PLASMA','TITAN','ATLAS','CORE',
  'MEGA_SWAY','SUPER_POP','HYPER_GROOVE','TURBO_STEP','BLAST_BEAT','GIGA_PULSE','ULTRA_WAVE','COSMIC_ROCK',
  'NEON_SURGE','PLASMA_DANCE','SOLAR_STOMP','STELLAR_FLEX','ASTRO_GROOVE','VORTEX_FLOW','QUANTUM_SWAY','PULSAR_BEAT',
  'TITAN_STEP','ZETA_PULSE','OMEGA_WAVE','SUPERNOVA_X','CYBER_DANCE','MATRIX_GROOVE','LASER_STEP','VOLT_SWAY',
  'DYNAMIC_FX','KINETIC_X','PRISM_BEAT','QUASAR_STEP','ZENITH_FLOW','BLADE_DANCE','PHANTOM_X','SPECTRAL_SWAY',
  'NEBULA_STEP','GALACTIC_FX','ORBIT_PLUS','VOGUE_MAX','AIRWALK_X','TIDAL_FLOW','CYCLONE_FX','RIPPLE_MAX',
  'GLIDE_PLUS','SPRINT_X','FLOAT_MAX','SHUFFLE_X','ROCK_MAX','FUNK_PLUS','BURST_MAX','ECHO_X','NEXUS_MAX','FLUX_PLUS',
  'APEX_DRIVE','MIRAGE_SWAY','VIPER_FLEX','ASTRA_JUMP','INFINITY_RUN','HYDRA_BOUNCE','OZONE_SHUFFLE','CELESTIAL_POP',
  'TEMPEST_SWAY','LUMEN_BEAT','AETHER_GLIDE','SOLIS_TWIST','CHRONO_STEP','NOVA_SURGE','ECLIPSE_FLEX','COSMOS_FLOW',
  'APOLLO_JUMP','NEBULA_DANCE','GIGA_SWAY','NEXUS_BOUNCE'
],
      P=(a,b,c=0)=>({x:a,y:b,z:c}),            // 建立 3D 座標點 {x, y, z} 的輔助函式
      mix=(a,b,t)=>a+(b-a)*t,                 // 線性內插（Linear Interpolation）
      ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; // 平滑漸變緩和函數 (Ease In/Out)

// RWD 畫布高解析度縮放處理
function size(){
  d=devicePixelRatio||1;
  w=innerWidth;
  h=innerHeight;
  C.width=w*d;
  C.height=h*d;
  x.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',size);
size();

// 音訊上下文初始化
function ctx(){
  if(!ac) ac=new AudioContext();
  return ac;
}

// 綁定音訊分析器 (AnalyserNode)
function hook(source){
  an=ac.createAnalyser();
  an.fftSize=512;
  an.smoothingTimeConstant=.78;
  source.connect(an);
  data=new Uint8Array(an.frequencyBinCount);
}

// 點擊按鈕擷取系統/電腦音訊
B.sys.onclick=async()=>{
  try{
    const st=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    const at=st.getAudioTracks();
    if(!at.length) throw 0;
    hook(ctx().createMediaStreamSource(new MediaStream(at)));
    B.sys.textContent='正在擷取電腦音訊';
  }catch{
    B.sys.textContent='未取得音訊';
  }
};

// 隨機切換舞步（有音樂重低音擊中時才會觸發）
function pick(t){
  from=m;
  m=Math.floor(Math.random()*names.length);
  blendAt=t;
  L.textContent=`${names[m]} / ${String(m+1).padStart(2,'0')}`;

  // 每次切換舞步時，最左邊的火柴人基準往左偏移 3 個像素
  if(leftState === 0 && !isRunningLeft) {
    shiftLeft += 5;
    if(shiftLeft >= 500) {
      leftState = 2; // 達到上限，進入步驟1：暫停動作 1 秒
      leftStateStartTime = performance.now();
    }
  }
}

// 計算骨骼頂點位置（從原點 o 沿著角度 angle 延伸長度 len，並加上 z 軸偏移）
function bone(o,len,angle,z=0){
  return P(o.x+Math.sin(angle)*len, o.y+Math.cos(angle)*len, o.z+z);
}

// 設計專屬的跑步動作姿態 (isRun = true 時調用)
function runPose(t, scaleFactor = 1, headScaleBoost = 1) {
  let q = t / 1000 * 12, // 跑步加快頻率
      s = Math.sin(q),
      c = Math.cos(q),
      unit = (h * (1/3) / 8.5) * scaleFactor,
      headDiameter = unit * 1.3 * headScaleBoost,
      headSize = headDiameter / 2,
      bodyLen  = unit * 1.8,
      upperArm = unit * 1.2,
      lowerArm = unit * 1.2,
      upperLeg = unit * 1.5,
      lowerLeg = unit * 1.5,
      
      // 跑步動作：身體向右傾斜，雙臂雙腿交替大甩動
      hy = -bodyLen + Math.abs(s) * 8, hx = 5, tilt = 0.25,
      la = -1.2 * s - 0.2, lf = -0.8 * Math.max(0, s),
      ra = 1.2 * s + 0.2, rf = 0.8 * Math.max(0, -s),
      lt = 1.0 * s, lc = -0.8 * Math.max(0, -s),
      rt = -1.0 * s, rc = -0.8 * Math.max(0, s);

  let hip=P(hx,hy,0),
      neck=bone(hip, bodyLen, Math.PI+tilt),
      head=P(neck.x + Math.sin(Math.PI+tilt)*headSize, neck.y + Math.cos(Math.PI+tilt)*headSize, neck.z),
      le=bone(neck, upperArm, la),
      lh=bone(le, lowerArm, lf),
      re=bone(neck, upperArm, ra),
      rh=bone(re, lowerArm, rf),
      lk=bone(hip, upperLeg, lt),
      lfp=bone(lk, lowerLeg, lc),
      rk=bone(hip, upperLeg, rt),
      rfp=bone(rk, lowerLeg, rc);
      
  return {hip,chest:neck,neck,head,ls:neck,rs:neck,le,re,lh,rh,lk,rk,lf:lfp,rf:rfp, bodyLen, headSize, upperArm, lowerArm, upperLeg, lowerLeg};
}

// ==========================================
// 2. 核心：姿態與舞步計算 Engine (pose)
// ==========================================
function pose(t, id, scaleFactor = 1, headScaleBoost = 1){
  let q=t/1000,
      s=Math.sin(q*(3.6+(id%5)*.3)),  // 正弦週期波（控制律動擺動）
      c=Math.cos(q*(3.6+(id%5)*.3)),  // 餘弦週期波
      k=id%120,                       // 舞步索引編號
      
      // unit: 基礎骨架單位長度（根據螢幕高度按比例縮放）
      unit = (h * (1/3) / 8.5) * scaleFactor,
      // elastic: 隨音樂能量與時間伸縮的彈性係數
      elastic = 1 + Math.sin(q * 14) * 0.15 * (lev + 0.4),
      
      // 頭部大小與半徑計算
      headDiameter = unit * 1.3 * headScaleBoost,
      headSize = headDiameter / 2, 

      // 肢體各段骨骼長度定義
      bodyLen  = unit * 1.8 * elastic,                   // 軀幹長度
      upperArm = unit * 1.2 * (1 + Math.cos(q*12)*0.1), // 大臂長度
      lowerArm = unit * 1.2 * (1 + Math.sin(q*12)*0.1), // 前臂長度
      upperLeg = unit * 1.5 * (1 + Math.sin(q*10)*0.1), // 大腿長度
      lowerLeg = unit * 1.5 * (1 + Math.cos(q*10)*0.1), // 小腿長度
      
      hy = -bodyLen, hx = 0, tilt = 0,
      la = -0.72, lf = -0.34, ra = 0.72, rf = 0.34, lt = -0.18, lc = -0.08, rt = 0.18, rc = 0.08;

  if(k===0){
    // 0 號舞步：經典自然律動姿態 (ORBIT)
    hx=2; tilt=0.00;  
    la=-0.29; lf=-0.69; ra=0.34; rf=0.26;  
    lt=-0.37; lc=-0.08; rt=0.31; rc=0.08;
  }
  else if(k===1){la=-2.35;lf=-2.72;ra=2.22;rf=2.62;tilt=.08*s}
  else if(k===2){hx=17*s;tilt=.18*s;la=-1.5;lf=-1.05;ra=1.5;rf=1.05}
  else if(k===3){hy=-bodyLen-19*Math.abs(s);la=-1.05;lf=-.55;ra=1.05;rf=.55;lt=-.52;lc=-.2;rt=.52;rc=.2}
  else if(k===4){hx=32*s;la=-.9;lf=-.4;ra=.9;rf=.4;lt=-.2-s*.22;rt=-.2-s*.22}
  else if(k===5){la=-1.9;lf=-1.25;ra=1.9;rf=1.25;lt=-.35*s;rt=.35*s}
  else if(k===6){la=-2.35;lf=-2.7;ra=.55+.38*s;rf=.2+.3*s;tilt=.1*s}
  else if(k===7){hx=29*s;tilt=.24*s;la=-1.15;lf=-.58;ra=1.15;rf=.58}
  else if(k===8){ra=1.35;rf=1.65;rt=.85*Math.max(0,s)+.18;rc=.55*Math.max(0,s)+.08}
  else if(k===9){tilt=.28*s;la=-.45;lf=-.12;ra=.45;rf=.12}
  else if(k===10){la=-.75-.35*s;lf=-.25-.3*s;ra=.75-.35*s;rf=.25-.3*s;lt=-.18-.18*s;rt=-.18-.18*s}
  else if(k===11){hx=12*c;la=-1.8;lf=-1.1;ra=0.5;rf=0.4;lt=-0.3;rt=0.4}
  else if(k===12){hx=-15*s;tilt=-0.15;la=0.8;lf=1.2;ra=-1.2;rf=-0.8}
  else if(k===13){hy=-bodyLen-10*s;la=-2.1;lf=-1.8;ra=2.1;rf=1.8;lt=-0.4;rt=0.4}
  else if(k===14){hx=22*s;tilt=0.2*c;la=-1.2;lf=-0.8;ra=1.2;rf=0.8;lt=-0.25;rt=-0.25}
  else if(k===15){hx=5*s;la=-0.5;lf=-0.2;ra=2.5;rf=2.1;lt=-0.1;rt=0.5}
  else if(k===16){hx=-18*c;la=-1.4;lf=-1.4;ra=1.4;rf=1.4;lt=-0.45;rt=0.45}
  else if(k===17){hx=15*s;tilt=0.3*s;la=-2.2;lf=-0.5;ra=0.2;rf=0.1;lt=-0.3;rt=0.2}
  else if(k===18){hx=-10*s;la=-0.3;lf=-0.1;ra=-0.3;rf=-0.1;lt=-0.5;rt=-0.5}
  else if(k===19){hx=35*s; tilt=-0.25; la=-2.5; lf=-1.8; ra=2.5; rf=1.8; lt=-0.4; rt=0.4;}
  else if(k===20){hx=-30*s; tilt=0.25; la=-1.5; lf=-0.5; ra=-1.5; rf=-0.5; lt=-0.2; rt=0.2;}
  else if(k===21){hx=-25; hy=-134; tilt=0.32;  la=-2.45; lf=-2.94; ra=1.21; rf=-0.15;  lt=0.13; lc=0.37; rt=1.14; rc=-0.16;}
  else if(k===22){hx=28*s; hy=-bodyLen-15*c; tilt=0.2*s; la=-2.8; lf=-2.1; ra=1.4; rf=0.8; lt=-0.6*s; rt=0.6*s;}
  else if(k===23){hx=-22*c; tilt=-0.3*s; la=0.5*s; lf=-1.2; ra=-2.5; rf=-1.8; lt=-0.4; lc=-0.8; rt=0.2;}
  else if(k===24){hx=18*s; hy=-bodyLen-25*Math.abs(c); tilt=0.1; la=-1.8; lf=-0.9; ra=1.8; rf=0.9; lt=-0.8; lc=-0.4; rt=0.8; rc=0.4;}
  else if(k===25){hx=-35*s; tilt=0.35*c; la=-3.0; lf=-2.8; ra=-1.2; rf=-0.5; lt=0.3*s; rt=-0.5*s;}
  else if(k===26){hx=12*c; hy=-bodyLen+15*s; tilt=-0.2*s; la=-1.1; lf=-2.2; ra=2.2; rf=1.1; lt=-0.5; lc=0.2; rt=-0.1;}
  else if(k===27){hx=-15*s; tilt=0.4*s; la=-2.2; lf=-0.3; ra=0.8; rf=2.1; lt=-0.7*c; rt=0.3*c;}
  else if(k===28){hx=30*c; hy=-bodyLen-12*s; la=-0.4; lf=-0.2; ra=2.8; rf=2.5; lt=-0.2; rt=0.9*s;}
  else if(k===29){hx=-28*s; tilt=-0.25*c; la=-2.7; lf=-1.5; ra=2.7; rf=1.5; lt=-0.6; lc=-0.3; rt=-0.2;}
  else if(k===30){hx=20*s; hy=-bodyLen-18*Math.abs(s); la=-1.5*c; lf=-0.8; ra=1.5*c; rf=0.8; lt=-0.4; rt=0.4;}
  else if(k===31){hx=20*c; tilt=0.2; la=-1.9; lf=-2.2; ra=1.9; rf=2.2; lt=-0.6; rt=0.6;}
  else if(k===32){hx=-25*s; tilt=-0.15; la=-0.8; lf=-2.5; ra=0.8; rf=2.5; lt=-0.3; rt=0.5;}
  else if(k===33){hx=30*s; tilt=0.3; la=-2.7; lf=-0.8; ra=2.7; rf=0.8; lt=-0.5; rt=-0.3;}
  else if(k===34){hx=-15*c; tilt=-0.2; la=-1.2; lf=-1.2; ra=2.1; rf=1.9; lt=-0.4; rt=0.4;}
  else if(k===35){hx=25*s; tilt=0.15; la=-2.1; lf=-1.9; ra=1.2; rf=1.2; lt=-0.3; rt=0.3;}
  else if(k===36){hx=40*s; tilt=-0.3; la=-2.9; lf=-2.5; ra=2.9; rf=2.5; lt=-0.7; rt=0.7;}
  else if(k===37){hx=-20*s; tilt=0.25*s; la=-1.4; lf=-2.8; ra=1.8; rf=0.6; lt=-0.5*c; rt=0.5*c;}
  else if(k===38){hx=25*c; hy=-bodyLen-22*s; tilt=-0.15; la=-2.9; lf=-2.0; ra=-0.5; rf=-0.2; lt=-0.3; rt=0.7;}
  else if(k===39){hx=-32*s; tilt=0.3; la=0.8; lf=1.5; ra=-2.8; rf=-2.2; lt=-0.8; lc=-0.2; rt=0.2;}
  else if(k===40){hx=15*s; hy=-bodyLen+10*c; la=-2.3; lf=-1.2; ra=2.3; rf=1.2; lt=-0.2; rt=-0.6;}
  else if(k===41){hx=-18*c; tilt=-0.35*s; la=-1.1; lf=-0.4; ra=2.7; rf=2.9; lt=-0.6*s; lc=-0.2; rt=0.4;}
  else if(k===42){hx=35*s; hy=-bodyLen-14*s; tilt=0.2; la=-3.1; lf=-2.7; ra=3.1; rf=2.7; lt=-0.5; rt=0.5;}
  else if(k===43){hx=-24*s; tilt=-0.2*c; la=-0.6; lf=-1.8; ra=1.6; rf=2.4; lt=-0.7; rt=0.1;}
  else if(k===44){hx=10*c; hy=-bodyLen-30*Math.abs(s); la=-2.0; lf=-1.0; ra=2.0; rf=1.0; lt=-0.9; lc=-0.5; rt=0.9; rc=0.5;}
  else if(k===45){hx=-30*c; tilt=0.4*s; la=-2.5; lf=-0.8; ra=-1.8; rf=-2.6; lt=0.2; rt=-0.8;}
  else if(k===46){hx=22*s; tilt=-0.1; la=-1.7; lf=-2.5; ra=0.9; rf=1.7; lt=-0.4*s; rt=0.8*s;}
  else if(k===47){hx=-16*s; hy=-bodyLen-12*c; la=-2.8; lf=-2.2; ra=2.8; rf=2.2; lt=-0.3; lc=-0.6; rt=0.3;}
  else if(k===48){hx=27*c; tilt=0.28*s; la=0.2; lf=-0.8; ra=2.4; rf=1.5; lt=-0.8*s; rt=-0.2*s;}
  else if(k===49){hx=-38*s; hy=-bodyLen+8*s; tilt=-0.3; la=-2.2; lf=-2.8; ra=2.2; rf=2.8; lt=-0.6; rt=0.6;}
  else if(k===50){hx=14*s; tilt=0.15*c; la=-1.3; lf=-0.5; ra=2.8; rf=2.2; lt=-0.2; rt=0.7;}
  else if(k===51){hx=-26*c; hy=-bodyLen-20*s; la=-2.9; lf=-1.4; ra=1.1; rf=0.3; lt=-0.7; lc=-0.3; rt=0.2;}
  else if(k===52){hx=32*s; tilt=-0.2*s; la=-0.9; lf=-1.9; ra=-2.1; rf=-1.3; lt=-0.5; rt=-0.5;}
  else if(k===53){hx=-12*s; hy=-bodyLen-16*Math.abs(c); la=-2.4; lf=-2.4; ra=2.4; rf=2.4; lt=-0.4*c; rt=0.4*c;}
  else if(k===54){hx=29*c; tilt=0.35; la=-3.0; lf=-2.1; ra=0.7; rf=1.9; lt=-0.8; rt=0.3;}
  else if(k===55){hx=-34*s; tilt=-0.18*s; la=-1.6; lf=-0.7; ra=2.6; rf=1.8; lt=-0.1; rt=-0.7;}
  else if(k===56){hx=18*s; hy=-bodyLen-25*s; la=-2.1; lf=-2.8; ra=-2.1; rf=-2.8; lt=-0.6; lc=-0.2; rt=0.6;}
  else if(k===57){hx=-22*c; tilt=0.22*c; la=-0.3; lf=-1.5; ra=2.3; rf=0.9; lt=-0.5*s; rt=0.5*s;}
  else if(k===58){hx=36*s; hy=-bodyLen+12*s; la=-2.6; lf=-1.8; ra=1.9; rf=2.7; lt=-0.7; rt=0.4;}

function fixedBone(o,a0,a1,b0,b1,u,len){
  let dx=mix(a1.x-a0.x,b1.x-b0.x,u),
      dy=mix(a1.y-a0.y,b1.y-b0.y,u),
      dz=mix(a1.z-a0.z,b1.z-b0.z,u),
      n=Math.hypot(dx,dy,dz)||1;
  return P(o.x+dx/n*len,o.y+dy/n*len,o.z+dz/n*len);
}

function blend(a,b,u){
  let hip=P(mix(a.hip.x,b.hip.x,u),mix(a.hip.y,b.hip.y,u),mix(a.hip.z,b.hip.z,u)),
      bodyLenM = mix(a.bodyLen, b.bodyLen, u),
      headSzM  = mix(a.headSize, b.headSize, u),
      upperArmM = mix(a.upperArm, b.upperArm, u),
      lowerArmM = mix(a.lowerArm, b.lowerArm, u),
      upperLegM = mix(a.upperLeg, b.upperLeg, u),
      lowerLegM = mix(a.lowerLeg, b.lowerLeg, u),
      
      neck=fixedBone(hip,a.hip,a.neck,b.hip,b.neck,u,bodyLenM),
      head=fixedBone(neck,a.neck,a.head,b.neck,b.head,u,headSzM),
      
      le=fixedBone(neck,a.neck,a.le,b.neck,b.le,u,upperArmM),
      lh=fixedBone(le,a.le,a.lh,b.le,b.lh,u,lowerArmM),
      re=fixedBone(neck,a.neck,a.re,b.neck,b.re,u,upperArmM),
      rh=fixedBone(re,a.re,a.rh,b.re,b.rh,u,lowerArmM),
      lk=fixedBone(hip,a.hip,a.lk,b.hip,b.lk,u,upperLegM),
      lf=fixedBone(lk,a.lk,a.lf,b.lk,b.lf,u,lowerLegM),
      rk=fixedBone(hip,a.hip,a.rk,b.hip,b.rk,u,upperLegM),
      rf=fixedBone(rk,a.rk,a.rf,b.rk,b.rf,u,lowerLegM);
      
  return {hip,chest:neck,neck,head,ls:neck,rs:neck,le,re,lh,rh,lk,rk,lf,rf};
}

function pr(p,cx,cy,sc,mir){
  let z=p.z+300,q=sc*330/z;
  return {x:cx+(mir?-p.x:p.x)*q,y:cy+p.y*q,r:q};
}

function orb(p,R,h,a=1,overrideColor=null){
  let g=x.createRadialGradient(p.x-R*.15,p.y-R*.18,0,p.x,p.y,R);
  g.addColorStop(0,'rgba(255,255,255,.96)');
  g.addColorStop(.19, overrideColor ? overrideColor : `hsla(${h},100%,70%,${a})`);
  g.addColorStop(1, overrideColor ? 'rgba(255,0,0,0)' : `hsla(${h},100%,50%,0)`);
  x.shadowBlur=30;
  x.shadowColor= overrideColor ? 'red' : `hsl(${h},100%,60%)`;
  x.fillStyle=g;
  x.beginPath();
  x.arc(p.x,p.y,R,0,7);
  x.fill();
  x.shadowBlur=0;
}

function line(a,b,h,t,al=1,overrideColor=null){
  let dx=b.x-a.x,dy=b.y-a.y,z=Math.hypot(dx,dy),q=Math.atan2(dy,dx);
  x.save();
  x.translate(a.x,a.y);
  x.rotate(q);
  let g=x.createLinearGradient(0,0,z,0);
  if(overrideColor) {
    g.addColorStop(0, `rgba(255,0,0,${al*.26})`);
    g.addColorStop(.48, `rgba(255,100,100,${al})`);
    g.addColorStop(1, `rgba(255,0,0,${al*.3})`);
  } else {
    g.addColorStop(0,`hsla(${(h-65+t*38)%360},100%,65%,${al*.26})`);
    g.addColorStop(.48,`hsla(${h},100%,73%,${al})`);
    g.addColorStop(1,`hsla(${(h+75)%360},100%,66%,${al*.3})`);
  }
  x.lineCap='round';
  x.shadowBlur=26+lev*32;
  x.shadowColor= overrideColor ? 'red' : `hsl(${h},100%,60%)`;
  x.strokeStyle=g;
  x.lineWidth=12*b.r;
  x.beginPath();
  x.moveTo(0,0);
  x.lineTo(z,0);
  x.stroke();
  x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.68)';
  x.lineWidth=1.45*b.r;
  x.stroke();
  x.restore();
}

function draw(p,t,cx,cy,sc,mir=false,al=1, colorOffset=0, isReflection=false, overrideColor=null){
  let a={};
  for(let k in p) {
    if(isReflection){
      let refP = { x: p[k].x, y: -p[k].y, z: p[k].z };
      a[k] = pr(refP, cx, cy, sc, mir);
    } else {
      a[k] = pr(p[k], cx, cy, sc, mir);
    }
  }
  
  let hu=(t*.04+m*27 + colorOffset)%360,
      ls=[['neck','hip'],['neck','le'],['le','lh'],['neck','re'],['re','rh'],['hip','lk'],['lk','lf'],['hip','rk'],['rk','rf']];
  
  let currentAlpha = isReflection ? al * 0.28 : al;

  ls.forEach((v,i)=>line(a[v[0]],a[v[1]],hu+i*22,t*.003,currentAlpha, overrideColor));
  let R=10*a.head.r;
  
  x.save();
  x.shadowBlur = isReflection ? 12 : 22+lev*20;
  x.shadowColor= overrideColor ? 'red' : `hsl(${hu+38},100%,60%)`;
  x.strokeStyle= overrideColor ? `rgba(255,50,50,${currentAlpha})` : `hsla(${hu+38},100%,75%,${currentAlpha})`;
  x.lineWidth=7*a.head.r;
  x.beginPath();
  x.arc(a.head.x,a.head.y,R,0,7);
  x.stroke();
  x.strokeStyle=`rgba(255,255,255,${isReflection ? 0.3 : 0.75})`;
  x.lineWidth=1.2*a.head.r;
  x.stroke();

  let headRot = t * 0.004;
  x.translate(a.head.x, a.head.y);
  x.rotate(headRot);
  x.strokeStyle = overrideColor ? `rgba(255,200,200,${currentAlpha})` : `hsla(${hu+180}, 100%, 85%, ${currentAlpha})`;
  x.lineWidth = 2 * a.head.r;
  x.beginPath();
  x.arc(0, 0, R * 0.95, 0, Math.PI * 1.5);
  x.stroke();
  x.restore();

  ls.forEach((v,i)=>{
    for(let j=0;j<3;j++){
      let u=(t*.001*(.32+i*.027)+j/3)%1;
      orb({x:mix(a[v[0]].x,a[v[1]].x,u),y:mix(a[v[0]].y,a[v[1]].y,u)},(1.7+lev*1.5)*a[v[0]].r,hu+i*22,currentAlpha*.7, overrideColor);
    }
  });
}

// 繪製驚嘆號與紅色閃光
function drawExclamation(headP, now) {
  x.save();
  let flash = Math.floor(now / 100) % 2 === 0;
  x.shadowBlur = 30;
  x.shadowColor = '#ff0000';
  x.fillStyle = flash ? '#ffffff' : '#ff0000';
  x.font = 'bold 100px sans-serif';
  x.textAlign = 'center';
  x.fillText('‼️', headP.x, headP.y - 60);
  x.restore();
}

// 繪製人物背後的方格造型牆面與輕微光影反光
function drawGridWall(t, fy) {
  x.save();
  let step = 45;
  let cols = Math.ceil(w / step);
  let rows = Math.ceil(fy / step);
  
  x.strokeStyle = 'rgba(112, 217, 255, 0.08)';
  x.lineWidth = 1;
  
  for(let i = 0; i <= cols; i++) {
    x.beginPath();
    x.moveTo(i * step, 0);
    x.lineTo(i * step, fy);
    x.stroke();
  }
  for(let j = 0; j <= rows; j++) {
    x.beginPath();
    x.moveTo(0, j * step);
    x.lineTo(w, j * step);
    x.stroke();
  }

  // 輕微火柴人光影的反光方格點綴
  let hu = (t * .04 + m * 27) % 360;
  for(let i = 0; i < cols; i++) {
    for(let j = 0; j < rows; j++) {
      let cellX = i * step + step / 2;
      let cellY = j * step + step / 2;
      let dist = Math.hypot(cellX - w * 0.82, cellY - fy * 0.5);
      if(dist < 400 && (i + j) % 3 === 0) {
        let alpha = Math.max(0, (1 - dist / 400) * (0.03 + lev * 0.08));
        x.fillStyle = `hsla(${hu}, 100%, 75%, ${alpha})`;
        x.fillRect(i * step + 1, j * step + 1, step - 2, step - 2);
      }
    }
  }
  x.restore();
}

// 繪製動態舞台燈光光暈與影子 (3 盞聚光燈，限制集中在三個人附近晃動，無聲音時隱藏)
function drawStageSpotlightsAndShadows(t, fy, dancers, hasAudio) {
  if (!hasAudio) return; // 沒有聲音時 spotlight 完全不出現

  let spotlightCount = 3;
  let intensity = 0.6 + Math.min(0.4, lev * 1.2);

  for (let i = 0; i < spotlightCount; i++) {
    let targetDancer = dancers[i % dancers.length];
    let angle = (t * 0.0015 * (i + 1) + i * 2.1);
    
    // 將 Spotlight 的移動範圍集中照射在目標舞者周圍晃動
    let lx = targetDancer.cx + Math.sin(angle) * 80;
    let ly = -50;
    
    let tx = targetDancer.cx + Math.cos(angle * 1.2) * 60;
    let ty = fy + Math.sin(angle * 1.5) * 20;
    
    let hue = (t * 0.03 + i * 120) % 360;

    x.save();
    
    // 1. 繪製牆面與地面的光束 (Cone Light)
    let beamGradient = x.createLinearGradient(lx, ly, tx, ty);
    beamGradient.addColorStop(0, `hsla(${hue}, 100%, 85%, ${0.45 * intensity})`);
    beamGradient.addColorStop(0.6, `hsla(${hue}, 100%, 65%, ${0.25 * intensity})`);
    beamGradient.addColorStop(1, 'transparent');

    x.fillStyle = beamGradient;
    x.beginPath();
    x.moveTo(lx - 25, ly);
    x.lineTo(tx - 120, ty);
    x.lineTo(tx + 120, ty);
    x.lineTo(lx + 25, ly);
    x.closePath();
    x.fill();

    // 2. 繪製地上照亮的光暈
    let floorLight = x.createRadialGradient(tx, ty, 10, tx, ty, 160);
    floorLight.addColorStop(0, `hsla(${hue}, 100%, 85%, ${0.55 * intensity})`);
    floorLight.addColorStop(0.5, `hsla(${hue}, 100%, 60%, ${0.25 * intensity})`);
    floorLight.addColorStop(1, 'transparent');

    x.fillStyle = floorLight;
    x.beginPath();
    x.ellipse(tx, ty, 160, 60, 0, 0, Math.PI * 2);
    x.fill();

    // 3. 計算並繪製舞者被燈光照射時投射在牆面/地面的陰影
    dancers.forEach(d => {
      let headP = pr(d.pose.head, d.cx, d.cy, d.sc, false);
      
      let dx = headP.x - lx;
      let shadowDx = dx * 0.8;
      let shadowY = fy;
      let shadowHeight = (fy - headP.y) * 1.1;

      let shadowGlow = x.createRadialGradient(
        headP.x + shadowDx, shadowY - shadowHeight * 0.4, 15,
        headP.x + shadowDx, shadowY - shadowHeight * 0.4, 140
      );
      shadowGlow.addColorStop(0, `rgba(0, 2, 8, ${0.8 * intensity})`);
      shadowGlow.addColorStop(0.6, `rgba(0, 2, 8, ${0.4 * intensity})`);
      shadowGlow.addColorStop(1, 'transparent');

      x.fillStyle = shadowGlow;
      x.beginPath();
      x.ellipse(headP.x + shadowDx, shadowY - shadowHeight * 0.2, 80, shadowHeight * 0.8, shadowDx * 0.003, 0, Math.PI * 2);
      x.fill();
    });

    x.restore();
  }
}

// ==========================================
// 3. 主動畫與繪圖循環 (loop)
// ==========================================
function loop(t){
  let hasAudio = false;

  // 取得音訊頻率資料，檢測是否有聲音發出
  if(an){
    an.getByteFrequencyData(data);
    let av=data.reduce((s,v)=>s+v,0)/data.length/255,
        lo=data.slice(0,24).reduce((s,v)=>s+v,0)/24/255;
    lev=mix(lev,av,.16);

    if(av > 0.02) {
      hasAudio = true; // 偵測到有效聲音訊號
    }

    if(lo>.38&&t-lastBeat>850){
      lastBeat=t;
      pick(t);
    }
  }

  // 沒有輸入任何音源，或者偵測到沒有任何聲音時：人物動作回復到舞步 0
  if(!hasAudio){
    lev=mix(lev,.08+Math.sin(t*.002)*.025,.06);
    if(m !== 0) {
      from = m;
      m = 0;
      blendAt = t; // 設定 Blend 時間戳記，平滑回復到 0 號舞步 (舞步0)
      L.textContent = `${names[0]} / 01`;
    }
  }
  
  // 清空畫布
  x.clearRect(0,0,w,h);
  
  let cx=w*.82, cy=h*.73, sc=Math.min(w,h)*.00205, fy=h*.81;

  // 1. 繪製背景牆面霓虹光暈 (Radial Gradient)
  let wallGlow = x.createRadialGradient(cx, cy - h*0.2, 10, cx, cy - h*0.2, w*0.55);
  wallGlow.addColorStop(0, `hsla(${(t*.04+80)%360}, 100%, 65%, ${.12 + lev*.35})`);
  wallGlow.addColorStop(0.5, `hsla(${(t*.04)%360}, 80%, 35%, ${.08 + lev*.2})`);
  wallGlow.addColorStop(1, 'transparent');
  x.fillStyle = wallGlow;
  x.fillRect(0, 0, w, fy);

  // 2. 繪製人物背後方格牆面 (Grid Wall)
  drawGridWall(t, fy);

  // 3. 繪製舞台地板區域漸變色 (Linear Gradient)
  let floorGlow = x.createLinearGradient(0, fy, 0, h);
  floorGlow.addColorStop(0, `hsla(${(t*.04)%360}, 100%, 70%, ${.22 + lev*.3})`);
  floorGlow.addColorStop(0.15, `hsla(${(t*.04+40)%360}, 90%, 40%, ${.15 + lev*.2})`);
  floorGlow.addColorStop(0.6, `rgba(5, 12, 28, 0.85)`);
  floorGlow.addColorStop(1, `#010102`);
  x.fillStyle = floorGlow;
  x.fillRect(0, fy, w, h - fy);

  // 4. 繪製地平交界霓虹亮線
  x.save();
  x.strokeStyle = `hsla(${(t*.04+120)%360}, 100%, 80%, ${.35 + lev*.4})`;
  x.lineWidth = 2;
  x.shadowBlur = 15;
  x.shadowColor = `hsla(${(t*.04+120)%360}, 100%, 60%, 0.8)`;
  x.beginPath();
  x.moveTo(0, fy);
  x.lineTo(w, fy);
  x.stroke();
  x.restore();
  
  // 5. 繪製透視地板橫向條紋 (3D 地板透視感)
  x.save();
  x.globalAlpha = .28 + lev * .25;
  for(let i=0; i<22; i++){
    let y = fy + i*i*1.35, s = 60 + i*38;
    x.strokeStyle = `hsla(${(t*.05+i*12)%360}, 100%, 70%, ${0.5 - i*0.02})`;
    x.lineWidth = i === 0 ? 2 : 1;
    x.beginPath();
    x.moveTo(cx-s, y);
    x.lineTo(cx+s, y);
    x.stroke();
  }
  x.restore();
  
  let u=ease(Math.min(1,(t-blendAt)/1000));
  let mainGroupCx = cx; 

  let offLeft   = Math.sin(t * 0.0012) * 280 + Math.cos(t * 0.0023) * 120;
  let offRight  = Math.cos(t * 0.0015) * 260 + Math.sin(t * 0.0019) * 140;
  let offCenter = Math.sin(t * 0.0018) * 220 - Math.cos(t * 0.0011) * 100;

  // 處理最左邊火柴人的狀態機邏輯
  let now = performance.now();
  if (leftState === 1) { // 1. 暫停動作 1 秒
    if (now - leftStateStartTime >= 1000) {
      leftState = 2;
      leftStateStartTime = now;
    }
  } else if (leftState === 2) { // 2. 閃爍驚嘆號與全身紅色光芒 1 秒
    if (now - leftStateStartTime >= 1000) {
      leftState = 3;
      isRunningLeft = true;
    }
  } else if (leftState === 3) { // 3. 往回跑回基準點
    shiftLeft -= 4;
    if (shiftLeft <= 0) {
      shiftLeft = 0;
      isRunningLeft = false;
      leftState = 4; // 跑回基準點後進入步驟 4
      leftStateStartTime = now;
    }
  } else if (leftState === 4) { // 4. 使用零套舞步，站在原地 1 秒
    if (now - leftStateStartTime >= 1000) {
      leftState = 0; // 完成後恢復正常跟上舞步
    }
  }

  let cxLeft = mainGroupCx - 170 - shiftLeft, cyLeft = cy + 30, tLeft = t + 300 + offLeft;
  
  // 計算左側火柴人的姿態
  let pLeft;
  let overrideColorLeft = null;

  if (leftState === 1 || leftState === 2) {
    pLeft = blend(pose(leftStateStartTime + 300 + offLeft, from, 0.6, 1.5), pose(leftStateStartTime + 300 + offLeft, m, 0.6, 1.5), u);
    if (leftState === 2) overrideColorLeft = 'rgba(255,0,0,1)';
  } else if (leftState === 3) {
    pLeft = runPose(tLeft, 0.6, 1.5);
  } else if (leftState === 4) {
    pLeft = pose(tLeft, 0, 0.6, 1.5); // 零套舞步
  } else {
    pLeft = blend(pose(tLeft, from, 0.6, 1.5), pose(tLeft, m, 0.6, 1.5), u);
  }

  let cxRight = mainGroupCx + 130, cyRight = cy + 15, tRight = t + 600 + offRight;
  let pRight = blend(pose(tRight, from, 0.7, 1.6), pose(tRight, m, 0.7, 1.6), u);

  let cxCenter = mainGroupCx - 30, cyCenter = cy, tCenter = t + offCenter;
  let pMain = blend(pose(tCenter, from, 1, 1), pose(tCenter, m, 1, 1), u);

  const drawSpotlight = (xPos, yPos, radius, hue) => {
    if(!hasAudio) return; // 無聲音時隱藏
    x.save();
    let spotGlow = x.createRadialGradient(xPos, yPos, 2, xPos, yPos, radius);
    spotGlow.addColorStop(0, `hsla(${hue}, 100%, 75%, ${0.45 + lev*0.3})`);
    spotGlow.addColorStop(0.5, `hsla(${hue}, 100%, 50%, ${0.25 + lev*0.2})`);
    spotGlow.addColorStop(1, 'transparent');
    x.fillStyle = spotGlow;
    x.beginPath();
    x.ellipse(xPos, yPos, radius, radius * 0.35, 0, 0, Math.PI * 2);
    x.fill();
    x.restore();
  };

  let hueL = (tLeft*.04 + m*27 + 120) % 360;
  let hueR = (tRight*.04 + m*27) % 360;
  let hueC = (tCenter*.04 + m*27 + 240) % 360;

  // 顯著放大底座預設腳下 Spotlight 橢圓光圈範圍
  drawSpotlight(cxLeft, fy + 10, 160, hueL);
  drawSpotlight(cxRight, fy + 15, 180, hueR);
  drawSpotlight(cxCenter, fy + 20, 220, hueC);

  // 繪製動態舞台聚光燈與對應人物陰影 (只在有聲音時顯示)
  drawStageSpotlightsAndShadows(t, fy, [
    { pose: pLeft, cx: cxLeft, cy: cyLeft, sc: sc * 1.8 },
    { pose: pRight, cx: cxRight, cy: cyRight, sc: sc * 2.1 },
    { pose: pMain, cx: cxCenter, cy: cyCenter, sc: sc* 1.8 }
  ], hasAudio);

  // 6. 繪製鏡面倒影區域
  x.save();
  x.beginPath();
  x.rect(0, fy, w, h - fy);
  x.clip();

  draw(pLeft, tLeft, cxLeft, cyLeft, sc, false, 0.8, 120, true, overrideColorLeft);
  draw(pRight, tRight, cxRight, cyRight, sc * 1.1, false, 1.0, 0, true);
  draw(pMain, tCenter, cxCenter, cyCenter, sc, false, 0.9, 240, true);
  x.restore();

  // 7. 繪製實態火柴人主體
  draw(pLeft, tLeft, cxLeft, cyLeft, sc, false, 0.8, 120, false, overrideColorLeft);
  draw(pRight, tRight, cxRight, cyRight, sc * 1.1, false, 1.0, 0);
  draw(pMain, tCenter, cxCenter, cyCenter, sc, false, 0.9, 240);

  // 若為步驟 2，繪製驚嘆號
  if (leftState === 2) {
    let headP = pr(pLeft.head, cxLeft, cyLeft, sc, false);
    drawExclamation(headP, now);
  }
  
  requestAnimationFrame(loop);
}

// 啟動動畫
L.textContent='ORBIT / 01';
requestAnimationFrame(loop);
</script>
